<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What did this chicken cost?</title>
<style>
  body { max-width: 1000px; margin: 1em auto; padding: 0 1em; line-height: 1.45; }
  .nav { color: #666; }
  h1 { margin-bottom: 0.2em; }
  .cols { display: flex; gap: 2em; flex-wrap: wrap; align-items: flex-start; }
  .cols > div { flex: 1 1 320px; }
  input[type=number] { font-size: 1.2em; width: 6em; padding: 0.2em 0.4em; }
  select { font-size: 1em; padding: 0.2em; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.5em; }
  .items button { display: block; width: 100%; text-align: left; font: inherit; padding: 0; background: #f6f6f6; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; overflow: hidden; }
  .items button:hover { background: #ececec; }
  .items button.on { background: #e4ecf7; border-color: #9bb7dd; box-shadow: 0 0 0 2px #9bb7dd; }
  .items button img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .items button span { display: block; padding: 0.35em 0.5em; font-size: 0.92em; line-height: 1.3; }
  .items button small { color: #666; display: block; }
  #credits { font-size: 0.85em; color: #666; }
  #credits li { margin: 0.15em 0; }
  #headline { font-size: 1.35em; margin: 1.2em 0 0.4em; }
  #headline small { font-size: 0.7em; color: #555; }
  h2 { font-size: 1.1em; margin: 0.8em 0 0.4em; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 0.3em 0.5em; border-bottom: 1px solid #eee; vertical-align: top; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; width: 8em; }
  td.range { color: #777; white-space: nowrap; width: 8em; font-size: 0.9em; }
  td.def { color: #555; font-size: 0.92em; }
  .muted { color: #666; font-size: 0.9em; }
  #result[hidden] { display: none; }
  details.harm { border-bottom: 1px solid #eee; }
  details.harm summary { display: flex; gap: 0.5em; align-items: baseline; padding: 0.35em 0.5em; cursor: pointer; list-style: none; }
  details.harm summary::-webkit-details-marker { display: none; }
  details.harm summary .num { width: 8em; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: bold; }
  details.harm summary .name { flex: 1; }
  details.harm summary .name::before { content: '\25BE\00a0'; color: #888; }
  details.harm[open] summary .name::before { content: '\25B4\00a0'; }
  details.harm summary .range { color: #777; white-space: nowrap; font-size: 0.9em; }
  details.harm .desc { margin: 0 0.5em 0.6em 8.5em; color: #444; font-size: 0.92em; }
  .total { padding: 0.35em 0.5em; display: flex; gap: 0.5em; }
  .total .num { width: 8em; text-align: right; font-weight: bold; }
</style>
</head>
<body>

<p class="nav"><b id="nav-calc"></b> &middot; <a href="equation.html" id="nav-eq"></a></p>
<h1 id="title"></h1>

<div class="cols">
  <div>
    <p><b id="type-heading"></b></p>
    <p><input type="number" id="amount" min="0" step="0.5" placeholder="0"> <select id="unit"><option value="oz">oz</option><option value="g">grams</option></select></p>
    <p class="muted" id="type-hint"></p>
  </div>
  <div>
    <p><b id="pick-heading"></b></p>
    <div class="items" id="items"></div>
    <p class="muted" id="pick-hint"></p>
  </div>
</div>

<div id="result" hidden>
  <p id="headline"></p>
  <div class="cols">
    <div>
      <h2 id="causes-heading"></h2>
      <div id="causes"></div>
    </div>
    <div>
      <h2 id="levels-heading"></h2>
      <table id="levels"></table>
    </div>
  </div>
  <p class="muted" id="foot"></p>
</div>

<p class="muted" id="caveat"></p>
<details id="credits"><summary id="credits-heading"></summary><ul id="credits-list"></ul></details>

<script src="text.js"></script>
<script src="photos.js"></script>
<script src="wfp.js"></script>
<script src="chicken.js"></script>
<script>
var ITEMS = TEXT.plate.items;
var P = TEXT.plate;

function n(x, d) { return Number(x.toFixed(d === undefined ? 1 : d)).toLocaleString('en-US'); }
function dur(h) {
  if (h === 0) return '0 hours';
  if (h < 1 / 60) return n(h * 3600, h * 3600 < 10 ? 1 : 0) + ' seconds';
  if (h < 1) return n(h * 60, 0) + ' minutes';
  if (h < 10) return n(h, 1) + ' hours';
  return n(h, 0) + ' hours';
}
function durRange(lo, hi) {
  if (hi === 0) return '';
  var unit = hi < 1 / 60 ? 3600 : hi < 1 ? 60 : 1;
  var d = hi * unit < 10 ? 1 : 0;
  var u = unit === 3600 ? ' s' : unit === 60 ? ' min' : ' h';
  return fmt(P.rangeLine, { lo: n(lo * unit, d), hi: n(hi * unit, d) + u });
}
function frac(x) { return x > 0 && x < 0.67 ? 'about 1/' + Math.round(1 / x) : n(x, 2); }

function currentGrams() {
  var v = parseFloat(document.getElementById('amount').value);
  if (!(v > 0)) return 0;
  return document.getElementById('unit').value === 'oz' ? v * OZ_TO_G : v;
}

function render() {
  var g = currentGrams();
  var box = document.getElementById('result');
  if (!(g > 0)) { box.hidden = true; return; }
  var sysKey = 'conventional';   // nearly all chicken sold is conventional; the Equation page has the comparison
  var st = servingStats(g, sysKey);
  box.hidden = false;

  var vars = { days: n(st.days, st.days < 10 ? 1 : 0), daysLo: n(st.daysLo, st.daysLo < 10 ? 1 : 0), daysHi: n(st.daysHi, st.daysHi < 10 ? 1 : 0), farm: TEXT.systems[sysKey].farm, fraction: frac(st.lifetimes), lifetime: st.lifetimeDays, grams: n(st.cookedG, 0) };
  document.getElementById('headline').innerHTML = fmt(P.headline, vars) + '<br><small>' + fmt(P.headlineSmall, vars) + '</small>';

  var openHarms = {};
  document.querySelectorAll('#causes details[open]').forEach(function (d) { openHarms[d.getAttribute('data-name')] = true; });
  document.getElementById('causes').innerHTML = st.causes.slice().sort(function (a, b) { return b.hours - a.hours; }).map(function (c) {
    var what = c.what.charAt(0).toUpperCase() + c.what.slice(1);
    return '<details class="harm" data-name="' + c.name + '"' + (openHarms[c.name] ? ' open' : '') + '><summary>' +
      '<span class="num">' + dur(c.hours) + '</span><span class="name">' + fmt(P.causeLine, { harm: c.name.toLowerCase() }) + '</span><span class="range">' + durRange(c.lo, c.hi) + '</span></summary>' +
      '<div class="desc">' + fmt(P.causeDetail, { what: what, perBird: dur(c.perBird), fraction: frac(st.lifetimes) }) + '</div></details>';
  }).join('') + '<div class="total"><span class="num">' + dur(st.allHours) + '</span><span>' + P.totalLine + '</span></div>';

  document.getElementById('levels').innerHTML = st.levels.slice().reverse().map(function (l) {
    return '<tr><td class="num"><b>' + dur(l.hours) + '</b></td><td>' + fmt(P.levelLine, { level: l.name.toLowerCase(), definition: l.def }) + '</td><td class="range">' + durRange(l.lo, l.hi) + '</td></tr>';
  }).join('');

  document.getElementById('foot').innerHTML = P.footnote;
}

function pick(i) {
  var it = ITEMS[i];
  var unit = document.getElementById('unit').value;
  document.getElementById('amount').value = unit === 'oz' ? Math.round(it[1] / OZ_TO_G * 10) / 10 : it[1];
  document.querySelectorAll('.items button').forEach(function (b, j) { b.classList.toggle('on', j === i); });
  render();
}

window.addEventListener('DOMContentLoaded', function () {
  document.title = P.title;
  [['nav-calc', TEXT.nav.calculator], ['nav-eq', TEXT.nav.equation], ['title', P.title], ['caveat', P.caveat],
   ['type-heading', P.typeHeading], ['type-hint', P.typeHint], ['pick-heading', P.pickHeading], ['pick-hint', P.pickHint],
   ['causes-heading', P.causesHeading], ['levels-heading', P.levelsHeading]].forEach(function (x) { document.getElementById(x[0]).innerHTML = x[1]; });
  document.getElementById('credits-heading').textContent = P.photoCredits;
  var cl = document.getElementById('credits-list');
  ITEMS.forEach(function (it) {
    var ph = it[3] && typeof PHOTOS !== 'undefined' && PHOTOS[it[3]];
    if (!ph) return;
    var li = document.createElement('li');
    li.innerHTML = it[0] + ': <a href="' + ph.page + '">' + ph.title + '</a> by ' + ph.author + ', <a href="' + ph.licenseUrl + '">' + ph.license + '</a>, via Wikimedia Commons' + (ph.note ? ' (' + ph.note + ')' : '') + '.';
    cl.appendChild(li);
  });
  if (!cl.children.length) document.getElementById('credits').hidden = true;
  var items = document.getElementById('items');
  ITEMS.forEach(function (it, i) {
    var b = document.createElement('button');
    b.innerHTML = (it[3] ? '<img src="' + it[3] + '" alt="" loading="lazy">' : '') +
      '<span>' + it[0] + ' <small>' + n(it[1] / OZ_TO_G, 1) + ' oz' + (it[2] ? ', ' + it[2] : '') + '</small></span>';
    b.addEventListener('click', function () { pick(i); });
    items.appendChild(b);
  });
  document.getElementById('amount').addEventListener('input', function () {
    document.querySelectorAll('.items button').forEach(function (b) { b.classList.remove('on'); });
    render();
  });
  document.getElementById('unit').addEventListener('change', function () {
    var a = document.getElementById('amount'); var v = parseFloat(a.value);
    if (v > 0) a.value = document.getElementById('unit').value === 'oz' ? Math.round(v / OZ_TO_G * 10) / 10 : Math.round(v * OZ_TO_G);
    render();
  });
  render();
});
</script>

</body>
</html>
