<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken welfare calculator</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<style>
  body { max-width: 1100px; margin: 1em auto; padding: 0 1em; --line: #777; }
  /* Each derivation block: a thread line running down its left edge to its result row. */
  blockquote { margin: 0.3em 0 0.3em 10px; padding-left: 18px; border-left: 2px solid var(--line); }
  blockquote blockquote { --line: #9a9a9a; }
  blockquote blockquote blockquote { --line: #b8b8b8; }
  blockquote blockquote blockquote blockquote { --line: #d0d0d0; }
  /* The "=" line under the operands, in the same colour as its thread. */
  hr { border: 0; border-top: 2px solid var(--line); margin: 0.5em 0 0.4em; }
  /* Rows: capped in width so the words and their number stay close; each column centred so operators sit under their terms. */
  table.row { width: 100%; max-width: 820px; }
  table.row td.words, table.row td.nums { text-align: center; }
  table.row td.glyph { color: #555; }
  table[data-toggle], table[data-focus] { cursor: pointer; }
  table[data-toggle]:hover, table[data-focus]:hover { background: #f3f3f3; }
  #notes { margin-top: 2em; font-size: 0.95em; color: #333; }
  #notes summary { cursor: pointer; }
</style>
</head>
<body>

<h1>Chicken welfare calculator</h1>

<p>
  One serving is <input type="number" id="oz" value="6" min="0" step="0.5" size="4"> oz of cooked chicken.
  &nbsp; Harm: <select id="harm"><option value="-1">All harms</option></select>
</p>

<p>Words on the left, numbers on the right. A row marked &#9650; is computed from rows that unfold above it. Hover a row for a one-line explanation.</p>

<div id="tree"></div>

<details id="notes">
<summary>Notes and sources</summary>
<div id="notes-body"></div>
</details>

<script>
// ---------------------------------------------------------------------------
// Sources
// ---------------------------------------------------------------------------
var SRC = {
  nass:    'https://www.nass.usda.gov/Publications/Todays_Reports/reports/plva0425.pdf',
  umaine:  'https://extension.umaine.edu/publications/2223e/',
  wisc:    'https://livestock.extension.wisc.edu/articles/bird-breakdown-exploring-yields-and-cuts-of-poultry/',
  cooking: 'https://www.ars.usda.gov/ARSUserFiles/80400525/data/retn/usda_cookingyields_meatpoultry.pdf',
  ncc:     'https://www.nationalchickencouncil.org/about-the-industry/statistics/u-s-broiler-performance/',
  wfp:     'https://welfarefootprint.org/broilers/',
  track:   'https://pain-track.org/broilers',
  defs:    'https://welfarefootprint.org/technical-definitions/pain-intensities/'
};

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
var OZ_TO_G = 28.35;
var COOKING_YIELD = 0.75;
var LIVE_LB_PER_YEAR = 61.1e9;      // lb of live chickens produced in the U.S., 2024
var BIRDS_PER_YEAR = 9.33e9;        // chickens produced, 2024
var LIVE_LB = LIVE_LB_PER_YEAR / BIRDS_PER_YEAR;   // 6.55 lb per bird
var LIVE_G = LIVE_LB * 453.6;
var DRESSING = 0.75;
var EDIBLE_SHARE = 0.74;
var RAW_MEAT_PER_BIRD = LIVE_G * DRESSING * EDIBLE_SHARE;   // g
var LIFETIME_DAYS = 47;

// Hours of pain over one conventional chicken's lifetime, Welfare Footprint Project.
// [name, mean, lower, upper, what it is]. Per-cause bounds not yet loaded (see TODO.md).
var HARMS = [
  ['Lameness', 457.9, null, null, 'leg and joint disorders from growing too fast; walking hurts or becomes impossible'],
  ['No foraging or exploring', 76.7, null, null, 'barren sheds with nothing to scratch, peck or investigate'],
  ['No dustbathing', 70.0, null, null, 'no loose, dry substrate for the bathing behaviour that keeps feathers healthy'],
  ['No perching', 63.0, null, null, 'no raised places to rest, which chickens seek out for safety'],
  ['Heat stress', 38.9, null, null, 'heavy birds in crowded sheds cannot shed heat; they pant and become lethargic'],
  ['Ascites', 28.3, null, null, 'fluid builds up in the abdomen when the heart cannot keep up with rapid growth'],
  ['Sudden death syndrome', 0.0, null, null, 'acute heart failure; brief but intense, so it adds almost no hours']
];
var INTENSITIES = [
  ['Annoying',     324.7, 212.8, 436.5, 'unpleasant, but does not disrupt normal activity'],
  ['Hurtful',      333.6, 195.1, 472.1, 'hard to ignore; the bird is aware of it most of the time'],
  ['Disabling',     50.3,  33.0,  67.5, 'continuously distressing; no enjoyment is possible'],
  ['Excruciating', 30.2 / 3600, 8.8 / 3600, 51.6 / 3600, 'intolerable even for seconds']
];
var HARM_TOTAL = HARMS.reduce(function (s, h) { return s + h[1]; }, 0);

// ---------------------------------------------------------------------------
// Formatting helpers
// ---------------------------------------------------------------------------
function n(x, d) { return Number(x.toFixed(d === undefined ? 1 : d)).toLocaleString('en-US'); }
function tex(x, d) { return n(x, d).replace(/,/g, '{,}'); }
function T(words) { return '\\text{' + words + '}'; }
function F(top, bottom) { return '\\frac{' + T(top) + '}{' + T(bottom) + '}'; }          // word fraction
function L(url, body) { return '\\href{' + url + '}{' + body + '}'; }                   // link
function G(x) { return tex(x, 0) + '\\ \\text{g}'; }
function hrs(h) {
  if (h === 0) return '0\\ \\text{h}';
  if (h < 1 / 60) return tex(h * 3600) + '\\ \\text{s}';
  if (h < 1) return tex(h * 60) + '\\ \\text{min}';
  return tex(h) + '\\ \\text{h}';
}
function range(lo, hi) {
  var unit = hi < 1 / 60 ? 's' : hi < 1 ? 'min' : 'h';
  var k = unit === 's' ? 3600 : unit === 'min' ? 60 : 1;
  return '[\\,' + tex(lo * k) + '\\text{–}' + tex(hi * k) + '\\ \\text{' + unit + '}\\,]';
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function rep(x, k) { var a = []; for (var i = 0; i < k; i++) a.push(x); return a; }

// ---------------------------------------------------------------------------
// The equation tree.
//
// Every node is one row: words on the left (name), the number on the right (value),
// and a one-line `tip` shown on hover. A node with `terms` is computed from them:
// when opened, the terms unfold ABOVE the row, stacked with `ops` between them
// (`pre` is an operator written before the first term), then a line, then the row
// itself as their result. `extras` and `subs` are context rows shown above the terms.
// ---------------------------------------------------------------------------
function buildTree(oz, hi) {     // hi = index into HARMS, or -1 for all harms
  var cookedG = oz * OZ_TO_G;
  var rawG = cookedG / COOKING_YIELD;
  var lifetimes = rawG / RAW_MEAT_PER_BIRD;
  var lx = tex(lifetimes, 3);
  var approx = lifetimes > 0 && lifetimes < 0.67 ? ' \\approx \\tfrac{1}{' + Math.round(1 / lifetimes) + '}' : '';
  var im = 0, ilo = 0, ihi = 0; INTENSITIES.forEach(function (i) { im += i[1]; ilo += i[2]; ihi += i[3]; });

  var rawPerLifetime = {
    id: 'raw-per-lifetime', name: F('Raw Meat', 'Animal Lifetime'), value: G(RAW_MEAT_PER_BIRD),
    tip: 'Raw boneless meat from one chicken: live weight, times the percentage that is carcass, times the percentage of the carcass that is meat.',
    ops: ['\u00d7', '\u00d7'],
    terms: [
      { id: 'live-weight', name: F('Live Weight', 'Animal'), value: G(LIVE_G) + '\\ (' + tex(LIVE_LB, 2) + '\\ \\text{lb})',
        tip: 'U.S. average for 2024 (USDA): all live weight produced in the year divided by the number of birds.',
        ops: ['\u00f7'],
        terms: [
          { name: F('Live Weight Produced', 'Year'), value: L(SRC.nass, '61.1 \\times 10^{9}\\ \\text{lb}'), tip: 'USDA NASS, 2024. Click the number for the source.' },
          { name: F('Animals Produced', 'Year'), value: L(SRC.nass, '9.33 \\times 10^{9}'), tip: 'USDA NASS, 2024. Click the number for the source.' }
        ] },
      { name: T('Dressing Percentage'), value: L(SRC.umaine, tex(DRESSING * 100, 0) + '\\%'),
        tip: 'Ready-to-cook carcass as a share of live weight; 70–78% is typical. Click the number for the source.' },
      { name: T('Edible Share Percentage'), value: L(SRC.wisc, tex(EDIBLE_SHARE * 100, 0) + '\\%'),
        tip: 'Boneless meat as a share of the carcass. Industry average; individual cuts vary by about ±10%. Click the number for the source.' }
    ]
  };

  var lifetimesPerServing = {
    id: 'lifetimes-per-serving', name: F('Animal Lifetime', 'Serving'), value: lx + '\\ \\text{chickens}' + approx,
    tip: 'How many chickens\u2019 worth of meat is on the plate.',
    ops: ['\u00d7'],
    terms: [
      {
        id: 'raw-per-serving', name: F('Raw Meat', 'Serving'), value: G(rawG),
        tip: 'The serving\u2019s weight before cooking.',
        ops: ['\u00d7'],
        terms: [
          { id: 'cooked-per-serving', name: F('Cooked Meat', 'Serving'), value: G(cookedG),
            tip: 'The ounces you typed at the top, in grams.',
            ops: ['\u00d7'],
            terms: [
              { name: T('Ounces Eaten'), value: tex(oz) + '\\ \\text{oz}', tip: 'Your input.' },
              { name: T('Grams per Ounce'), value: '28.35\\ \\text{g/oz}', tip: 'Unit conversion.' }
            ] },
          { id: 'raw-per-cooked', name: F('Raw Meat', 'Cooked Meat'), value: tex(1 / COOKING_YIELD, 2),
            tip: 'Meat loses about a quarter of its weight in cooking, so each cooked gram began as about 1.33 g raw.',
            pre: '1\\ \\div',
            terms: [ { name: T('Cooking Yield'), value: L(SRC.cooking, tex(COOKING_YIELD, 2)),
                       tip: 'Share of raw weight left after cooking (USDA). Click the number for the source.' } ] }
        ]
      },
      { id: 'lifetimes-per-raw', name: F('Animal Lifetime', 'Raw Meat'), value: '\\frac{1}{' + G(RAW_MEAT_PER_BIRD) + '}',
        tip: 'One chicken for every ' + n(RAW_MEAT_PER_BIRD, 0) + ' g of raw meat.',
        pre: '1\\ \\div', terms: [rawPerLifetime] }
    ]
  };

  var lifetimeRows = [
    { name: T('Animal Lifetime'), value: L(SRC.ncc, LIFETIME_DAYS + '\\ \\text{days}') + ' = ' + tex(LIFETIME_DAYS * 24, 0) + '\\ \\text{h}',
      tip: 'Average U.S. market age (National Chicken Council). Click for the source.' },
    { name: F('Time in Pain', 'Animal Lifetime'), value: '\\frac{' + hrs(HARM_TOTAL) + '}{' + tex(LIFETIME_DAYS * 24, 0) + '\\ \\text{h}} = ' + tex(HARM_TOTAL / (LIFETIME_DAYS * 24) * 100, 0) + '\\%',
      tip: 'Share of its life the average bird spends in some level of pain.' }
  ];
  var byIntensity = {
    id: 'by-intensity', name: F('All Harms by Intensity', 'Serving'), value: hrs(im * lifetimes) + '\\ ' + range(ilo * lifetimes, ihi * lifetimes),
    tip: 'The same hours split by how bad the pain is. Mean, then the 90% interval in brackets.',
    ops: rep('+', INTENSITIES.length - 1),
    terms: INTENSITIES.map(function (i) {
      return { name: F(i[0], 'Serving'), value: hrs(i[1] * lifetimes) + '\\ ' + range(i[2] * lifetimes, i[3] * lifetimes),
               tip: i[0] + ': ' + i[4] + '.',
               ops: ['\u00d7'],
               terms: [
                 { name: L('#lifetimes-per-serving', F('Animal Lifetime', 'Serving')), value: L('#lifetimes-per-serving', lx), tip: 'From the left branch of the equation.' },
                 { name: F(i[0], 'Animal Lifetime'), value: L(SRC.wfp, hrs(i[1])) + '\\ ' + range(i[2], i[3]), tip: 'Welfare Footprint Project, conventional broilers: mean and 90% interval. Click for the source.' }
               ] };
    })
  };

  var harmPerLifetime, harmPerServing, breakdown = null;
  var wfpTip = 'Welfare Footprint Project: hours an average conventional chicken spends in this pain over its whole life. Click the number for the source.';
  if (hi >= 0) {
    var h = HARMS[hi];
    var share = HARM_TOTAL > 0 ? h[1] / HARM_TOTAL * 100 : 0;
    harmPerLifetime = {
      id: 'harm-per-lifetime', name: F(h[0], 'Animal Lifetime'), value: L(SRC.track, hrs(h[1])),
      tip: h[0] + ': ' + h[4] + '. ' + wfpTip,
      extras: [
        { name: F('All Harms', 'Animal Lifetime'), value: hrs(HARM_TOTAL), tip: 'All seven causes added together.' },
        { name: F(h[0], 'All Harms'), value: tex(share, 0) + '\\%', tip: 'This harm\u2019s share of all pain hours.' }
      ].concat(lifetimeRows),
      subs: [byIntensity]
    };
    harmPerServing = {
      id: 'harm-per-serving', name: F(h[0], 'Serving'), value: '\\mathbf{' + hrs(h[1] * lifetimes) + '}',
      tip: 'Hours of ' + h[0].toLowerCase() + ' behind this serving: ' + tex(share, 0) + '% of the ' + n(HARM_TOTAL * lifetimes) + ' h of pain of all kinds behind it.'
    };
  } else {
    harmPerLifetime = {
      id: 'harm-per-lifetime', name: F('All Harms', 'Animal Lifetime'), value: hrs(HARM_TOTAL),
      tip: 'Welfare Footprint Project: hours an average conventional chicken spends in pain over its whole life, all causes added.',
      extras: lifetimeRows, subs: [byIntensity],
      ops: rep('+', HARMS.length - 1),
      terms: HARMS.map(function (x, i) { return { name: F(x[0], 'Animal Lifetime'), value: L(SRC.track, hrs(x[1])), tip: x[0] + ': ' + x[4] + '. Click the number for the source.', focus: i }; })
    };
    harmPerServing = {
      id: 'harm-per-serving', name: F('All Harms', 'Serving'), value: '\\mathbf{' + hrs(HARM_TOTAL * lifetimes) + '}',
      tip: 'Hours of pain of all kinds behind this serving.'
    };
    breakdown = HARMS.map(function (x, i) { return { name: F(x[0], 'Serving'), value: hrs(x[1] * lifetimes), tip: 'Click to focus the equation on ' + x[0].toLowerCase() + '.', focus: i }; });
  }

  return { terms: [lifetimesPerServing, harmPerLifetime], ops: ['\u00d7'], result: harmPerServing, breakdown: breakdown };
}

// ---------------------------------------------------------------------------
// Rendering. Every row is a table: [toggle] [words] [numbers].
// An expandable row is preceded by its (hidden) derivation block.
// ---------------------------------------------------------------------------
var openState = {};   // which rows are unfolded, kept across re-renders

function eqCell(src) { return '<div class="eq" data-tex="' + esc(src) + '"></div>'; }
function bigIf(big, s) { return big ? '<big><big>' + s + '</big></big>' : s; }
function rowTable(node, id, big, glyph) {
  var attrs = id ? ' data-toggle="' + id + '"' : (node.focus !== undefined ? ' data-focus="' + node.focus + '"' : '');
  if (node.tip) attrs += ' title="' + esc(node.tip) + '"';
  return '<table width="100%" class="row"' + attrs + '><tr>' +
    '<td width="24" class="glyph" align="center">' + bigIf(big, glyph || '') + '</td>' +
    '<td width="50%" class="words" valign="middle">' + bigIf(big, eqCell('\\displaystyle ' + node.name)) + '</td>' +
    '<td width="50%" class="nums" valign="middle">' + bigIf(big, node.value ? eqCell('\\displaystyle ' + node.value) : '') + '</td></tr></table>';
}
function opRow(op, big) {
  return '<table width="100%" class="row"><tr><td width="24"></td>' +
    '<td width="50%" class="words">' + bigIf(big, op) + '</td><td width="50%" class="nums">' + bigIf(big, op) + '</td></tr></table>';
}
function expandable(node) { return !!(node.terms || node.subs || node.extras); }
function glyphFor(open) { return open ? '&#9661;' : '&#9650;'; }   // ▽ open, ▲ closed

// One row. Expandable rows get their derivation block placed ABOVE them.
function renderRow(node, path, big) {
  if (!expandable(node)) return rowTable(node, null, big);
  var id = node.id || path;
  var open = openState[id] === undefined ? !!node.open : openState[id];
  return '<blockquote id="' + id + '-block" data-block' + (open ? '' : ' hidden') + '>' + renderInside(node, id) + '</blockquote>' +
         '<div id="' + id + '-row">' + rowTable(node, id, big, '<span id="' + id + '-glyph">' + glyphFor(open) + '</span>') + '</div>';
}

// The derivation block: extras and subs first, then the terms with operators, then the line.
function renderInside(node, path, big) {
  var html = '';
  if (node.extras) node.extras.forEach(function (x, i) { html += renderRow(x, path + '-x' + i); });
  if (node.subs) node.subs.forEach(function (s, i) { html += renderRow(s, path + '-s' + i); });
  if (node.terms) {
    if (node.pre) html += opRow(eqCell(node.pre), big);
    node.terms.forEach(function (t, i) {
      if (i > 0) html += opRow(node.ops[i - 1], big);
      html += renderRow(t, path + '-' + i, big);
    });
    html += '<hr>';
  }
  return html;
}

function renderNotes() {
  var li = function (s) { return '<li>' + s + '</li>'; };
  return '<p><b>The harms</b> (Welfare Footprint Project, conventional fast-growing broilers). For each cause they combined how many birds are affected, how long it lasts and how intense it is, then summed over the bird\u2019s life of about 47 days. Lifetime is therefore not a separate multiplier: it is the window over which the hours accumulate.</p>' +
    '<ul>' + HARMS.map(function (h) { return li('<b>' + h[0] + '</b>: ' + h[4] + '.'); }).join('') + '</ul>' +
    '<p><b>The intensities</b> (<a href="' + SRC.defs + '">project definitions</a>):</p>' +
    '<ul>' + INTENSITIES.map(function (i) { return li('<b>' + i[0] + '</b>: ' + i[4] + '.'); }).join('') + '</ul>' +
    '<p><b>Uncertainty.</b> The project reports a mean and a 90% interval (5th to 95th percentile of many runs with every input varied over its plausible range); no median or 95% interval is published. The intervals are roughly \u00b140% around the mean and dominate the overall uncertainty; the weights and yields are industry averages good to about \u00b110%. Per-cause bounds exist in the project\u2019s dataset but are not loaded here yet. The by-cause and by-intensity totals differ by about 4% because they come from different releases of the same data.</p>' +
    '<p><b>Not included:</b> pain during transport and slaughter, breeder birds, and diseases the project did not model. The numbers are conservative.</p>' +
    '<p><b>Sources.</b></p><ol>' +
    li('Live weight: <a href="' + SRC.nass + '">USDA NASS, Poultry Production and Value 2024 Summary</a> (9.33 billion broilers, 61.1 billion lb).') +
    li('Dressing percentage 75%: <a href="' + SRC.umaine + '">University of Maine Extension, Understanding Poultry Yields</a>.') +
    li('Edible share percentage 74%: <a href="' + SRC.wisc + '">University of Wisconsin Extension, Bird Breakdown</a>.') +
    li('Cooking yield 0.75: <a href="' + SRC.cooking + '">USDA Table of Cooking Yields for Meat and Poultry</a>.') +
    li('Lifetime 47 days: <a href="' + SRC.ncc + '">National Chicken Council, U.S. Broiler Performance</a>.') +
    li('Hours of pain by intensity, mean and 90% interval: <a href="' + SRC.wfp + '">Welfare Footprint Institute, Broilers</a>, conventional scenario.') +
    li('Hours of pain by cause: <a href="' + SRC.track + '">Welfare Footprint Institute, Pain-Track for broilers</a>.') +
    '</ol>';
}

function update() {
  var oz = parseFloat(document.getElementById('oz').value) || 0;
  var hi = parseInt(document.getElementById('harm').value, 10);
  var tree = buildTree(oz, hi);
  var html = '';
  tree.terms.forEach(function (t, i) {
    if (i > 0) html += opRow(tree.ops[i - 1], true);
    html += renderRow(t, 'top-' + i, true);
  });
  html += opRow('=', true);
  html += renderRow(tree.result, 'top-result', true);
  if (tree.breakdown) {
    html += '<p>By cause, for this serving. Click one to focus on it.</p>';
    tree.breakdown.forEach(function (b, i) { html += renderRow(b, 'bd-' + i); });
  }
  var root = document.getElementById('tree');
  root.innerHTML = html;
  root.querySelectorAll('.eq').forEach(function (el) {
    var src = el.getAttribute('data-tex');
    if (typeof katex === 'undefined') { el.textContent = src; return; }
    katex.render(src, el, { displayMode: false, throwOnError: false, trust: function (c) { return c.command === '\\href'; } });
  });
}

// Open or close a row's derivation, keeping the row where it is on screen.
// Closing a row also closes everything nested inside it, so reopening shows one level.
function setOpen(id, open) {
  var block = document.getElementById(id + '-block');
  var row = document.getElementById(id + '-row');
  if (!block || !row) return;
  var before = row.getBoundingClientRect().top;
  block.hidden = !open;
  openState[id] = open;
  var g = document.getElementById(id + '-glyph');
  if (g) g.innerHTML = glyphFor(open);
  if (!open) {
    block.querySelectorAll('[data-block]').forEach(function (inner) {
      inner.hidden = true;
      var iid = inner.id.replace(/-block$/, '');
      openState[iid] = false;
      var ig = document.getElementById(iid + '-glyph');
      if (ig) ig.innerHTML = glyphFor(false);
    });
  }
  window.scrollBy(0, row.getBoundingClientRect().top - before);
}
function toggle(id) {
  var block = document.getElementById(id + '-block');
  if (block) setOpen(id, block.hidden);
}
// Open a row's derivation and every enclosing one, then scroll to the row.
function openLevel(id) {
  var el = document.getElementById(id + '-block');
  if (!el) return;
  var ids = [];
  while (el) {
    if (el.hasAttribute && el.hasAttribute('data-block')) ids.push(el.id.replace(/-block$/, ''));
    el = el.parentElement;
  }
  ids.reverse().forEach(function (x) { setOpen(x, true); });
  document.getElementById(id + '-row').scrollIntoView({ block: 'center' });
}

document.addEventListener('click', function (e) {
  var a = e.target.closest('a');
  if (!a && document.elementsFromPoint) {
    var stack = document.elementsFromPoint(e.clientX, e.clientY);
    for (var k = 0; k < stack.length && !a; k++) a = stack[k].closest('a[href^="#"]');
  }
  if (a) {
    var href = a.getAttribute('href') || '';
    if (href.charAt(0) !== '#') return;          // external source: let it open
    e.preventDefault();
    openLevel(href.slice(1));
    return;
  }
  var t = e.target.closest('table[data-toggle]');
  if (t) { toggle(t.getAttribute('data-toggle')); return; }
  var f = e.target.closest('table[data-focus]');
  if (f) { document.getElementById('harm').value = f.getAttribute('data-focus'); update(); window.scrollTo(0, 0); }
});

window.addEventListener('DOMContentLoaded', function () {
  var sel = document.getElementById('harm');
  HARMS.forEach(function (h, i) {
    var o = document.createElement('option'); o.value = i; o.textContent = h[0]; sel.appendChild(o);
  });
  sel.value = '0';   // default to lameness, the largest single harm
  document.getElementById('oz').addEventListener('input', update);
  sel.addEventListener('change', update);
  document.getElementById('notes-body').innerHTML = renderNotes();
  update();
});
</script>

</body>
</html>
