<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken welfare calculator</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
</head>
<body>

<h1>Chicken welfare calculator</h1>

<p>One serving is <input type="number" id="oz" value="6" min="0" step="0.5" size="4"> oz of cooked chicken.</p>

<p>Left: the equation in words. Right: the same equation with the numbers plugged in. Click any row or underlined term to open its own equation beneath it.</p>

<div id="tree"></div>

<script>
// ---------------------------------------------------------------------------
// Sources
// ---------------------------------------------------------------------------
var SRC = {
  nass:    'https://www.nass.usda.gov/Publications/Todays_Reports/reports/plva0425.pdf',
  umaine:  'https://extension.umaine.edu/publications/2223e/',
  wisc:    'https://livestock.extension.wisc.edu/articles/bird-breakdown-exploring-yields-and-cuts-of-poultry/',
  cooking: 'https://www.ars.usda.gov/ARSUserFiles/80400525/data/retn/usda_cookingyields_meatpoultry.pdf',
  ncc:     'https://www.nationalchickencouncil.org/about-the-industry/statistics/u-s-broiler-performance/',
  wfp:     'https://welfarefootprint.org/broilers/',
  track:   'https://pain-track.org/broilers',
  defs:    'https://welfarefootprint.org/technical-definitions/pain-intensities/'
};

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
var OZ_TO_G = 28.35;
var COOKING_YIELD = 0.75;
var LIVE_LB_PER_YEAR = 61.1e9;      // lb of live chickens produced in the U.S., 2024
var BIRDS_PER_YEAR = 9.33e9;        // chickens produced, 2024
var LIVE_LB = LIVE_LB_PER_YEAR / BIRDS_PER_YEAR;   // 6.55 lb per bird
var LIVE_G = LIVE_LB * 453.6;
var DRESSING = 0.75;
var EDIBLE_SHARE = 0.74;
var RAW_MEAT_PER_BIRD = LIVE_G * DRESSING * EDIBLE_SHARE;   // g
var LIFETIME_DAYS = 47;

// Hours of pain over one conventional chicken's lifetime, Welfare Footprint Project.
// [name, mean, lower, upper, what it is]. Per-cause bounds not yet loaded (see TODO.md).
var HARMS = [
  ['Lameness', 457.9, null, null, 'leg and joint disorders from growing too fast; walking hurts or becomes impossible'],
  ['No foraging or exploring', 76.7, null, null, 'barren sheds with nothing to scratch, peck or investigate'],
  ['No dustbathing', 70.0, null, null, 'no loose, dry substrate for the bathing behaviour that keeps feathers healthy'],
  ['No perching', 63.0, null, null, 'no raised places to rest, which chickens seek out for safety'],
  ['Heat stress', 38.9, null, null, 'heavy birds in crowded sheds cannot shed heat; they pant and become lethargic'],
  ['Ascites', 28.3, null, null, 'fluid builds up in the abdomen when the heart cannot keep up with rapid growth'],
  ['Sudden death syndrome', 0.0, null, null, 'acute heart failure; brief but intense, so it adds almost no hours']
];
var INTENSITIES = [
  ['Annoying',     324.7, 212.8, 436.5, 'unpleasant, but does not disrupt normal activity'],
  ['Hurtful',      333.6, 195.1, 472.1, 'hard to ignore; the bird is aware of it most of the time'],
  ['Disabling',     50.3,  33.0,  67.5, 'continuously distressing; no enjoyment is possible'],
  ['Excruciating', 30.2 / 3600, 8.8 / 3600, 51.6 / 3600, 'intolerable even for seconds']
];
var HARM_TOTAL = HARMS.reduce(function (s, h) { return s + h[1]; }, 0);

// ---------------------------------------------------------------------------
// Formatting helpers
// ---------------------------------------------------------------------------
function n(x, d) { return Number(x.toFixed(d === undefined ? 1 : d)).toLocaleString('en-US'); }
function tex(x, d) { return n(x, d).replace(/,/g, '{,}'); }
function T(words) { return '\\text{' + words + '}'; }
function F(top, bottom) { return '\\frac{' + T(top) + '}{' + T(bottom) + '}'; }          // word fraction
function L(url, body) { return '\\href{' + url + '}{' + body + '}'; }                   // link
function LF(id, top, bottom) { return L('#' + id, F(top, bottom)); }                    // clickable word fraction
function LT(id, words) { return L('#' + id, T(words)); }                               // clickable words
function G(x) { return tex(x, 0) + '\\ \\text{g}'; }
function hrs(h) {
  if (h === 0) return '0\\ \\text{h}';
  if (h < 1 / 60) return tex(h * 3600) + '\\ \\text{s}';
  if (h < 1) return tex(h * 60) + '\\ \\text{min}';
  return tex(h) + '\\ \\text{h}';
}
function range(lo, hi) {
  var unit = hi < 1 / 60 ? 's' : hi < 1 ? 'min' : 'h';
  var k = unit === 's' ? 3600 : unit === 'min' ? 60 : 1;
  return '[\\,' + tex(lo * k) + '\\text{–}' + tex(hi * k) + '\\ \\text{' + unit + '}\\,]';
}
function aligned(rows) {
  return '\\begin{aligned}' + rows.map(function (r) { return r.join(' & '); }).join(' \\\\ ') + '\\end{aligned}';
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

// ---------------------------------------------------------------------------
// The equation tree. Each node has:
//   name   words for the row title (left)        value  the number for the row title (right)
//   sym    equation in words (left)              num    the same equation in numbers (right)
//   note   HTML explanation                      children
// Children render as <details> directly beneath their parent's equation.
// ---------------------------------------------------------------------------
function buildTree(oz) {
  var cookedG = oz * OZ_TO_G;
  var rawG = cookedG / COOKING_YIELD;
  var lifetimes = rawG / RAW_MEAT_PER_BIRD;
  var lx = tex(lifetimes, 3);
  var approx = lifetimes > 0 && lifetimes < 0.67 ? ' \\approx \\tfrac{1}{' + Math.round(1 / lifetimes) + '}' : '';
  var im = 0, ilo = 0, ihi = 0; INTENSITIES.forEach(function (i) { im += i[1]; ilo += i[2]; ihi += i[3]; });

  return {
    id: 'top',
    ops: ['\u00d7', '='],   // written between the top-level rows
    children: [
      {
        id: 'lifetimes-per-serving', name: F('Animal Lifetime', 'Serving'), value: lx + approx,
        note: 'How many chickens\' worth of meat is on the plate: the raw meat in the serving divided by the raw meat one chicken yields in its lifetime.',
        sym: F('Animal Lifetime', 'Serving') + ' = ' + LF('raw-per-serving', 'Raw Meat', 'Serving') + ' \\div ' + LF('raw-per-lifetime', 'Raw Meat', 'Animal Lifetime'),
        num: lx + ' = ' + L('#raw-per-serving', G(rawG)) + ' \\div ' + L('#raw-per-lifetime', G(RAW_MEAT_PER_BIRD)),
        children: [
          {
            id: 'raw-per-serving', name: F('Raw Meat', 'Serving'), value: G(rawG),
            note: 'Meat loses about a quarter of its weight in cooking, so divide the cooked weight by the cooking yield to get back to raw.',
            sym: F('Raw Meat', 'Serving') + ' = ' + LF('cooked-per-serving', 'Cooked Meat', 'Serving') + ' \\div ' + LT('cooking-yield', 'Cooking Yield'),
            num: G(rawG) + ' = ' + L('#cooked-per-serving', G(cookedG)) + ' \\div ' + L('#cooking-yield', tex(COOKING_YIELD, 2)),
            children: [
              { id: 'cooked-per-serving', name: F('Cooked Meat', 'Serving'), value: G(cookedG),
                sym: F('Cooked Meat', 'Serving') + ' = ' + T('ounces eaten') + ' \\times ' + T('grams per ounce'),
                num: G(cookedG) + ' = ' + tex(oz) + '\\ \\text{oz} \\times 28.35\\ \\text{g/oz}',
                note: 'The ounces are the number you typed at the top.' },
              { id: 'cooking-yield', name: T('Cooking Yield'), value: L(SRC.cooking, tex(COOKING_YIELD, 2)),
                note: 'Share of raw weight left after cooking. Most roasted, grilled or fried cuts keep 70–80%. Source: <a href="' + SRC.cooking + '">USDA Table of Cooking Yields for Meat and Poultry</a>.' }
            ]
          },
          {
            id: 'raw-per-lifetime', name: F('Raw Meat', 'Animal Lifetime'), value: G(RAW_MEAT_PER_BIRD),
            note: 'What one chicken yields: its live weight, times the share that is carcass, times the share of the carcass that is boneless meat.',
            sym: F('Raw Meat', 'Animal Lifetime') + ' = ' + LF('live-weight', 'Live Weight', 'Animal') + ' \\times ' + LT('dressing', 'Dressing') + ' \\times ' + LT('edible-share', 'Edible Share'),
            num: G(RAW_MEAT_PER_BIRD) + ' = ' + L('#live-weight', G(LIVE_G)) + ' \\times ' + L('#dressing', tex(DRESSING, 2)) + ' \\times ' + L('#edible-share', tex(EDIBLE_SHARE, 2)),
            children: [
              { id: 'live-weight', name: F('Live Weight', 'Animal'), value: G(LIVE_G),
                note: 'U.S. average for 2024: all the live weight produced in the year divided by the number of birds. Source: <a href="' + SRC.nass + '">USDA NASS, Poultry Production and Value 2024 Summary</a>.',
                sym: F('Live Weight', 'Animal') + ' = ' + F('Live Weight Produced', 'Year') + ' \\div ' + F('Animals Produced', 'Year'),
                num: G(LIVE_G) + ' = ' + L(SRC.nass, '61.1 \\times 10^{9}\\ \\text{lb}') + ' \\div ' + L(SRC.nass, '9.33 \\times 10^{9}') + '\\\\[0.4em] (= ' + tex(LIVE_LB, 2) + '\\ \\text{lb})' },
              { id: 'dressing', name: T('Dressing'), value: L(SRC.umaine, tex(DRESSING, 2)),
                note: 'The ready-to-cook carcass as a share of live weight; 70–78% is typical. Source: <a href="' + SRC.umaine + '">University of Maine Extension, Understanding Poultry Yields</a>.' },
              { id: 'edible-share', name: T('Edible Share'), value: L(SRC.wisc, tex(EDIBLE_SHARE, 2)),
                note: 'Boneless meat as a share of the carcass. Source: <a href="' + SRC.wisc + '">University of Wisconsin Extension, Bird Breakdown</a>. These yields are industry averages; individual birds and cuts vary by roughly &plusmn;10%.' }
            ]
          }
        ]
      },
      {
        id: 'harm-per-lifetime', name: F('Specific Harm', 'Animal Lifetime'), value: hrs(HARM_TOTAL) + '\\ \\text{(all harms)}',
        note: 'How many hours an average conventional meat chicken spends in each kind of pain over its whole life, from the ' +
              '<a href="' + SRC.wfp + '">Welfare Footprint Project</a>. For each cause they combined how many birds are affected, how long it lasts and how intense it is, then summed over the bird\'s life. ' +
              'That is why the lifetime is not a separate multiplier: it is the window over which the hours accumulate.',
        rows: HARMS.map(function (h) { return [F(h[0], 'Animal Lifetime'), L(SRC.track, hrs(h[1]))]; })
              .concat(['hr',
                       [F('All Harms', 'Animal Lifetime'), hrs(HARM_TOTAL)],
                       [T('Animal Lifetime'), L(SRC.ncc, LIFETIME_DAYS + '\\ \\text{days}') + ' = ' + tex(LIFETIME_DAYS * 24, 0) + '\\ \\text{h}'],
                       [F('Time in Pain', 'Animal Lifetime'), '\\frac{' + hrs(HARM_TOTAL) + '}{' + tex(LIFETIME_DAYS * 24, 0) + '\\ \\text{h}} = ' + tex(HARM_TOTAL / (LIFETIME_DAYS * 24) * 100, 0) + '\\%']]),
        children: [
          { id: 'what-harms', name: T('What each harm is'), value: '',
            note: '<ul>' + HARMS.map(function (h) { return '<li><b>' + esc(h[0]) + '</b>: ' + esc(h[4]) + '.</li>'; }).join('') + '</ul>' +
                  '<p>The project publishes a lower and upper bound for each cause as well; they are not yet loaded here (see the repository\'s TODO).</p>' },
          { id: 'by-intensity', name: T('The same hours by intensity, with uncertainty'), value: hrs(im) + '\\ ' + range(ilo, ihi),
            note: 'The project ran its estimate many times with every input varied over its plausible range and reports the <b>mean</b> and a <b>90% interval</b> ' +
                  '(the 5th to 95th percentile of those runs; no median or 95% interval is published). Mean, then interval in brackets:',
            rows: INTENSITIES.map(function (i) {
                return [F(i[0], 'Serving') + ' = ' + F('Animal Lifetime', 'Serving') + ' \\times ' + F(i[0], 'Animal Lifetime'),
                        hrs(i[1] * lifetimes) + '\\ ' + range(i[2] * lifetimes, i[3] * lifetimes) + ' = ' + lx + ' \\times ' + L(SRC.wfp, hrs(i[1])) + '\\ ' + range(i[2], i[3])];
              }).concat(['hr',
                [F('All Intensities', 'Serving') + ' = ' + F('Animal Lifetime', 'Serving') + ' \\times ' + F('All Intensities', 'Animal Lifetime'),
                 '\\mathbf{' + hrs(im * lifetimes) + '}\\ ' + range(ilo * lifetimes, ihi * lifetimes) + ' = ' + lx + ' \\times ' + hrs(im) + '\\ ' + range(ilo, ihi)]]),
            children: [
              { id: 'intensity-defs', name: T('What the intensities mean'), value: '',
                note: '<ul>' + INTENSITIES.map(function (i) { return '<li><b>' + i[0] + '</b>: ' + i[4] + '.</li>'; }).join('') + '</ul>' +
                      '<p>Source: <a href="' + SRC.defs + '">Welfare Footprint Institute, pain intensity definitions</a>.</p>' },
              { id: 'uncertainty-notes', name: T('Reading the uncertainty'), value: '',
                note: '<p>Most of the uncertainty is in these pain estimates, not in the weights: the intervals are roughly &plusmn;40% around the mean. ' +
                      'The by-cause figures rest on the same evidence, so treat them as carrying about the same uncertainty. ' +
                      'The two breakdowns come from different releases of the same data and differ by about 4%, so read the by-cause numbers as proportions rather than exact hours. ' +
                      'The bracket on the total adds the individual intervals, which slightly overstates its width.</p>' +
                      '<p>Not included anywhere on this page: pain during transport and slaughter, breeder birds, and diseases the project did not model. The numbers are conservative.</p>' }
            ]
          }
        ]
      },
      {
        id: 'harm-per-serving', name: F('Specific Harm', 'Serving'), value: hrs(HARM_TOTAL * lifetimes) + '\\ \\text{(all harms)}', open: true,
        note: 'Your serving\'s share of each harm, for a ' + n(oz) + ' oz serving:',
        rows: HARMS.map(function (h) {
            return [F(h[0], 'Serving') + ' = ' + LF('lifetimes-per-serving', 'Animal Lifetime', 'Serving') + ' \\times ' + LF('harm-per-lifetime', h[0], 'Animal Lifetime'),
                    '\\mathbf{' + hrs(h[1] * lifetimes) + '} = ' + L('#lifetimes-per-serving', lx) + ' \\times ' + L('#harm-per-lifetime', hrs(h[1]))];
          }).concat(['hr',
            [F('All Harms', 'Serving') + ' = ' + LF('lifetimes-per-serving', 'Animal Lifetime', 'Serving') + ' \\times ' + LF('harm-per-lifetime', 'All Harms', 'Animal Lifetime'),
             '\\mathbf{' + hrs(HARM_TOTAL * lifetimes) + '} = ' + L('#lifetimes-per-serving', lx) + ' \\times ' + L('#harm-per-lifetime', hrs(HARM_TOTAL))]])
      }
    ]
  };
}

// ---------------------------------------------------------------------------
// Rendering: every row and every equation is a two-column table,
// words on the left, numbers on the right.
// ---------------------------------------------------------------------------
var openState = {};   // remembers which levels are open across re-renders

function eqCell(src, inline) {
  return '<div class="eq"' + (inline ? ' data-inline="1"' : '') + ' data-tex="' + esc(src).replace(/"/g, '&quot;') + '"></div>';
}
function twoCol(left, right, big) {
  var wrap = function (s) { return big ? '<big><big>' + s + '</big></big>' : s; };
  return '<table width="100%"><tr>' +
    '<td width="50%" align="center" valign="middle">' + wrap(left) + '</td>' +
    '<td width="50%" align="center" valign="middle">' + wrap(right) + '</td></tr></table>';
}

function rowTable(rows) {
  return '<table width="100%">' + rows.map(function (r) {
    if (r === 'hr') return '<tr><td colspan="2"><hr></td></tr>';
    return '<tr><td width="50%" align="center">' + eqCell(r[0]) + '</td><td width="50%" align="center">' + eqCell(r[1]) + '</td></tr>';
  }).join('') + '</table>';
}

function renderNode(node) {
  var html = '';
  if (node.note) html += '<p>' + node.note + '</p>';
  if (node.sym || node.num) html += twoCol(node.sym ? eqCell(node.sym) : '', node.num ? eqCell(node.num) : '');
  if (node.rows) html += rowTable(node.rows);
  if (node.children) {
    var top = node.id === 'top';
    html += node.children.map(function (c, i) {
      var open = openState[c.id] === undefined ? !!c.open : openState[c.id];
      var title = twoCol(eqCell('\\displaystyle ' + c.name, true), c.value ? eqCell('\\displaystyle ' + c.value, true) : '', top);
      var sep = top && i > 0 ? twoCol('<big><big>' + node.ops[i - 1] + '</big></big>', '<big><big>' + node.ops[i - 1] + '</big></big>') : '';
      return sep + '<details id="' + c.id + '"' + (open ? ' open' : '') + '><summary>' + title + '</summary>' +
             '<blockquote>' + renderNode(c) + '</blockquote></details>';
    }).join('');
  }
  return html;
}

function update() {
  var oz = parseFloat(document.getElementById('oz').value) || 0;
  var root = document.getElementById('tree');
  root.innerHTML = renderNode(buildTree(oz));
  root.querySelectorAll('.eq').forEach(function (el) {
    var src = el.getAttribute('data-tex');
    if (typeof katex === 'undefined') { el.textContent = src; return; }
    katex.render(src, el, { displayMode: !el.getAttribute('data-inline'), throwOnError: false, trust: function (c) { return c.command === '\\href'; } });
  });
  root.querySelectorAll('details').forEach(function (d) {
    d.addEventListener('toggle', function () { openState[d.id] = d.open; });
  });
}

// Clicking a term opens its level (and every level above it) and scrolls there.
function openLevel(id) {
  var el = document.getElementById(id);
  while (el) { if (el.tagName === 'DETAILS') el.open = true; el = el.parentElement; }
}
document.addEventListener('click', function (e) {
  var a = e.target.closest('a');
  if (!a && document.elementsFromPoint) {
    // KaTeX stacks layout spans over parts of a fraction; look beneath them for the link.
    var stack = document.elementsFromPoint(e.clientX, e.clientY);
    for (var k = 0; k < stack.length && !a; k++) a = stack[k].closest('a[href^="#"]');
  }
  if (!a) return;
  var href = a.getAttribute('href') || '';
  if (href.charAt(0) !== '#') return;
  e.preventDefault();
  openLevel(href.slice(1));
  document.getElementById(href.slice(1)).scrollIntoView({ block: 'start' });
});

window.addEventListener('DOMContentLoaded', function () {
  document.getElementById('oz').addEventListener('input', update);
  update();
});
</script>

</body>
</html>
