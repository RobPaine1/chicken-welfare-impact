<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken welfare calculator</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<style>
  body { max-width: 1100px; margin: 1em auto; padding: 0 1em; }
  /* The equation rows: capped in width so the words and their number stay close; each column centred. */
  table.row { width: 100%; max-width: 820px; }
  table.row td.words, table.row td.nums { text-align: center; }
  table.row td.glyph { color: #555; }
  table[data-toggle], tr[data-focus] { cursor: pointer; }
  table[data-toggle]:hover, tr[data-focus]:hover { background: #f3f3f3; }
  table[data-toggle].open { background: #f3f3f3; }
  /* A term's worked steps, shown directly beneath its row. */
  .panel { margin: 0.4em 0 1em 24px; }
  .panel h3 { font-size: 1em; font-weight: normal; color: #444; margin: 0.6em 0 0.3em; }
  table.steps { width: 100%; border-collapse: collapse; }
  table.steps th { text-align: left; font-weight: normal; color: #666; font-size: 0.85em; padding: 0.3em 0.6em; border-bottom: 1px solid #bbb; }
  table.steps td { padding: 0.45em 0.6em; border-bottom: 1px solid #e2e2e2; vertical-align: middle; }
  table.steps td.n { width: 1.5em; color: #888; text-align: right; }
  table.steps td.words { width: 55%; }
  table.steps tr.result td { font-weight: bold; }
  #notes { margin-top: 2em; font-size: 0.95em; color: #333; }
  #notes summary { cursor: pointer; }
</style>
</head>
<body>

<h1>Chicken welfare calculator</h1>

<p>
  One serving is <input type="number" id="oz" value="6" min="0" step="0.5" size="4"> oz of cooked chicken.
  &nbsp; Harm: <select id="harm"><option value="-1">All harms</option></select>
</p>

<p>Words on the left, numbers on the right. Click a row marked &#9662; to see how it is worked out, step by step.</p>

<div id="tree"></div>

<details id="notes">
<summary>Notes and sources</summary>
<div id="notes-body"></div>
</details>

<script>
// ---------------------------------------------------------------------------
// Sources
// ---------------------------------------------------------------------------
var SRC = {
  nass:    'https://www.nass.usda.gov/Publications/Todays_Reports/reports/plva0425.pdf',
  umaine:  'https://extension.umaine.edu/publications/2223e/',
  wisc:    'https://livestock.extension.wisc.edu/articles/bird-breakdown-exploring-yields-and-cuts-of-poultry/',
  cooking: 'https://www.ars.usda.gov/ARSUserFiles/80400525/data/retn/usda_cookingyields_meatpoultry.pdf',
  ncc:     'https://www.nationalchickencouncil.org/about-the-industry/statistics/u-s-broiler-performance/',
  wfp:     'https://welfarefootprint.org/broilers/',
  track:   'https://pain-track.org/broilers',
  defs:    'https://welfarefootprint.org/technical-definitions/pain-intensities/'
};

// ---------------------------------------------------------------------------
// Constants
// ---------------------------------------------------------------------------
var OZ_TO_G = 28.35;
var COOKING_YIELD = 0.75;
var LIVE_LB_PER_YEAR = 61.1e9;      // lb of live chickens produced in the U.S., 2024
var BIRDS_PER_YEAR = 9.33e9;        // chickens produced, 2024
var LIVE_LB = LIVE_LB_PER_YEAR / BIRDS_PER_YEAR;   // 6.55 lb per bird
var LIVE_G = LIVE_LB * 453.6;
var DRESSING = 0.75;
var EDIBLE_SHARE = 0.74;
var RAW_MEAT_PER_BIRD = LIVE_G * DRESSING * EDIBLE_SHARE;   // g
var LIFETIME_DAYS = 47;

// Hours of pain over one conventional chicken's lifetime, Welfare Footprint Project.
// [name, mean, lower, upper, what it is]. Per-cause bounds not yet loaded (see TODO.md).
var HARMS = [
  ['Lameness', 457.9, null, null, 'leg and joint disorders from growing too fast; walking hurts or becomes impossible'],
  ['No foraging or exploring', 76.7, null, null, 'barren sheds with nothing to scratch, peck or investigate'],
  ['No dustbathing', 70.0, null, null, 'no loose, dry substrate for the bathing behaviour that keeps feathers healthy'],
  ['No perching', 63.0, null, null, 'no raised places to rest, which chickens seek out for safety'],
  ['Heat stress', 38.9, null, null, 'heavy birds in crowded sheds cannot shed heat; they pant and become lethargic'],
  ['Ascites', 28.3, null, null, 'fluid builds up in the abdomen when the heart cannot keep up with rapid growth'],
  ['Sudden death syndrome', 0.0, null, null, 'acute heart failure; brief but intense, so it adds almost no hours']
];
var INTENSITIES = [
  ['Annoying',     324.7, 212.8, 436.5, 'unpleasant, but does not disrupt normal activity'],
  ['Hurtful',      333.6, 195.1, 472.1, 'hard to ignore; the bird is aware of it most of the time'],
  ['Disabling',     50.3,  33.0,  67.5, 'continuously distressing; no enjoyment is possible'],
  ['Excruciating', 30.2 / 3600, 8.8 / 3600, 51.6 / 3600, 'intolerable even for seconds']
];
var HARM_TOTAL = HARMS.reduce(function (s, h) { return s + h[1]; }, 0);

// ---------------------------------------------------------------------------
// Formatting helpers
// ---------------------------------------------------------------------------
function n(x, d) { return Number(x.toFixed(d === undefined ? 1 : d)).toLocaleString('en-US'); }
function tex(x, d) { return n(x, d).replace(/,/g, '{,}'); }
function T(words) { return '\\text{' + words + '}'; }
function F(top, bottom) { return '\\frac{' + T(top) + '}{' + T(bottom) + '}'; }          // word fraction
function L(url, body) { return '\\href{' + url + '}{' + body + '}'; }                   // link
function G(x) { return tex(x, 0) + '\\ \\text{g}'; }
function H(x) { return x + '\\ \\text{h}'; }
function hrs(h) {
  if (h === 0) return '0\\ \\text{h}';
  if (h < 1 / 60) return tex(h * 3600) + '\\ \\text{s}';
  if (h < 1) return tex(h * 60) + '\\ \\text{min}';
  return tex(h) + '\\ \\text{h}';
}
function range(lo, hi) {
  var unit = hi < 1 / 60 ? 's' : hi < 1 ? 'min' : 'h';
  var k = unit === 's' ? 3600 : unit === 'min' ? 60 : 1;
  return '[\\,' + tex(lo * k) + '\\text{–}' + tex(hi * k) + '\\ \\text{' + unit + '}\\,]';
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
var TIMES = ' \\times ', DIV = ' \\div ', EQ = ' = ', PLUS = ' + ';

// ---------------------------------------------------------------------------
// The equation: three rows, each with an optional table of worked steps.
// A step is [words, numbers] (both LaTeX) or a heading string.
// ---------------------------------------------------------------------------
function buildEquation(oz, hi) {     // hi = index into HARMS, or -1 for all harms
  var cookedG = oz * OZ_TO_G;
  var rawG = cookedG / COOKING_YIELD;
  var lifetimes = rawG / RAW_MEAT_PER_BIRD;
  var lx = tex(lifetimes, 3);
  var approx = lifetimes > 0 && lifetimes < 0.67 ? ' \\approx \\tfrac{1}{' + Math.round(1 / lifetimes) + '}' : '';
  var im = 0, ilo = 0, ihi = 0; INTENSITIES.forEach(function (i) { im += i[1]; ilo += i[2]; ihi += i[3]; });
  var lifeH = LIFETIME_DAYS * 24;

  var A = {
    id: 'lifetimes-per-serving', name: F('Animal Lifetime', 'Serving'), value: lx + '\\ \\text{chickens}' + approx,
    tip: 'How many chickens\u2019 worth of meat is on the plate.',
    steps: [
      [F('Cooked Meat', 'Serving') + EQ + T('Ounces Eaten') + TIMES + T('Grams per Ounce'),
       G(cookedG) + EQ + tex(oz) + '\\ \\text{oz}' + TIMES + '28.35\\ \\text{g/oz}'],
      [F('Raw Meat', 'Serving') + EQ + F('Cooked Meat', 'Serving') + TIMES + F('Raw Meat', 'Cooked Meat'),
       G(rawG) + EQ + G(cookedG) + TIMES + L(SRC.cooking, tex(1 / COOKING_YIELD, 2))],
      [F('Live Weight', 'Animal') + EQ + F('Live Weight Produced', 'Year') + DIV + F('Animals Produced', 'Year'),
       G(LIVE_G) + EQ + L(SRC.nass, '61.1 \\times 10^{9}\\ \\text{lb}') + DIV + L(SRC.nass, '9.33 \\times 10^{9}')],
      [F('Raw Meat', 'Animal Lifetime') + EQ + F('Live Weight', 'Animal') + TIMES + T('Dressing \\%') + TIMES + T('Edible Share \\%'),
       G(RAW_MEAT_PER_BIRD) + EQ + G(LIVE_G) + TIMES + L(SRC.umaine, '75\\%') + TIMES + L(SRC.wisc, '74\\%')],
      [F('Animal Lifetime', 'Serving') + EQ + F('Raw Meat', 'Serving') + DIV + F('Raw Meat', 'Animal Lifetime'),
       lx + '\\ \\text{chickens}' + EQ + G(rawG) + DIV + G(RAW_MEAT_PER_BIRD)]
    ]
  };

  var sumWords = HARMS.map(function (x) { return T(x[0]); }).join(PLUS);
  var sumNums = HARMS.map(function (x) { return L(SRC.track, tex(x[1])); }).join(PLUS) + '\\ \\text{h}';
  var intensitySteps = [
    'The same hours by intensity, all harms: mean, then the 90% interval in brackets'
  ].concat(INTENSITIES.map(function (i) {
    return [F(i[0], 'Animal Lifetime'), L(SRC.wfp, hrs(i[1])) + '\\ ' + range(i[2], i[3])];
  })).concat([
    [F('All Intensities', 'Animal Lifetime') + EQ + INTENSITIES.map(function (i) { return T(i[0]); }).join(PLUS),
     hrs(im) + '\\ ' + range(ilo, ihi)]
  ]);

  var B, C, breakdown = null;
  if (hi >= 0) {
    var h = HARMS[hi];
    var share = HARM_TOTAL > 0 ? h[1] / HARM_TOTAL : 0;
    B = {
      id: 'harm-per-lifetime', name: F(h[0], 'Animal Lifetime'), value: L(SRC.track, hrs(h[1])),
      tip: h[0] + ': ' + h[4] + '. Hours an average conventional chicken spends in this pain over its life (Welfare Footprint Project).',
      steps: [
        [F(h[0], 'Animal Lifetime') + EQ + T('Welfare Footprint Project estimate'), L(SRC.track, hrs(h[1]))],
        [F('All Harms', 'Animal Lifetime') + EQ + sumWords, hrs(HARM_TOTAL) + EQ + sumNums],
        [F(h[0], 'All Harms') + EQ + F(h[0], 'Animal Lifetime') + DIV + F('All Harms', 'Animal Lifetime'),
         tex(share * 100, 0) + '\\%' + EQ + hrs(h[1]) + DIV + hrs(HARM_TOTAL)],
        [T('Animal Lifetime') + EQ + T('Days Alive') + TIMES + T('Hours per Day'),
         H(tex(lifeH, 0)) + EQ + L(SRC.ncc, LIFETIME_DAYS + '\\ \\text{days}') + TIMES + '24\\ \\text{h/day}'],
        [F('Time in Pain', 'Animal Lifetime') + EQ + F('All Harms', 'Animal Lifetime') + DIV + T('Animal Lifetime'),
         tex(HARM_TOTAL / lifeH * 100, 0) + '\\%' + EQ + hrs(HARM_TOTAL) + DIV + H(tex(lifeH, 0))]
      ].concat(intensitySteps)
    };
    C = {
      id: 'harm-per-serving', name: F(h[0], 'Serving'), value: '\\mathbf{' + hrs(h[1] * lifetimes) + '}',
      tip: 'Hours of ' + h[0].toLowerCase() + ' behind this serving.',
      steps: [
        [F(h[0], 'Serving') + EQ + F('Animal Lifetime', 'Serving') + TIMES + F(h[0], 'Animal Lifetime'),
         hrs(h[1] * lifetimes) + EQ + lx + TIMES + hrs(h[1])],
        [F('All Harms', 'Serving') + EQ + F('Animal Lifetime', 'Serving') + TIMES + F('All Harms', 'Animal Lifetime'),
         hrs(HARM_TOTAL * lifetimes) + EQ + lx + TIMES + hrs(HARM_TOTAL)],
        [F(h[0], 'All Harms'), tex(share * 100, 0) + '\\%']
      ]
    };
  } else {
    B = {
      id: 'harm-per-lifetime', name: F('All Harms', 'Animal Lifetime'), value: hrs(HARM_TOTAL),
      tip: 'Hours an average conventional chicken spends in pain over its life, all causes added (Welfare Footprint Project).',
      steps: [
        [F('All Harms', 'Animal Lifetime') + EQ + sumWords, hrs(HARM_TOTAL) + EQ + sumNums],
        [T('Animal Lifetime') + EQ + T('Days Alive') + TIMES + T('Hours per Day'),
         H(tex(lifeH, 0)) + EQ + L(SRC.ncc, LIFETIME_DAYS + '\\ \\text{days}') + TIMES + '24\\ \\text{h/day}'],
        [F('Time in Pain', 'Animal Lifetime') + EQ + F('All Harms', 'Animal Lifetime') + DIV + T('Animal Lifetime'),
         tex(HARM_TOTAL / lifeH * 100, 0) + '\\%' + EQ + hrs(HARM_TOTAL) + DIV + H(tex(lifeH, 0))]
      ].concat(intensitySteps)
    };
    C = {
      id: 'harm-per-serving', name: F('All Harms', 'Serving'), value: '\\mathbf{' + hrs(HARM_TOTAL * lifetimes) + '}',
      tip: 'Hours of pain of all kinds behind this serving. Open to see it by cause.',
      steps: ['By cause. Click one to focus the equation on it.'].concat(HARMS.map(function (x, i) {
        return { focus: i, words: F(x[0], 'Serving') + EQ + F('Animal Lifetime', 'Serving') + TIMES + F(x[0], 'Animal Lifetime'),
                 nums: hrs(x[1] * lifetimes) + EQ + lx + TIMES + hrs(x[1]) };
      }))
    };
  }
  return { A: A, B: B, C: C };
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
var openState = {};

function eqCell(src) { return '<span class="eq" data-tex="' + esc(src) + '"></span>'; }
function big(s) { return '<big><big>' + s + '</big></big>'; }
function rowTable(node) {
  var open = !!openState[node.id];
  return '<table width="100%" class="row' + (open ? ' open' : '') + '" data-toggle="' + node.id + '" title="' + esc(node.tip || '') + '"><tr>' +
    '<td width="24" class="glyph" align="center">' + big('<span id="' + node.id + '-glyph">' + (open ? '&#9652;' : '&#9662;') + '</span>') + '</td>' +
    '<td width="50%" class="words">' + big(eqCell('\\displaystyle ' + node.name)) + '</td>' +
    '<td width="50%" class="nums">' + big(eqCell('\\displaystyle ' + node.value)) + '</td></tr></table>';
}
function opRow(op) {
  return '<table width="100%" class="row"><tr><td width="24"></td>' +
    '<td width="50%" class="words">' + big(op) + '</td><td width="50%" class="nums">' + big(op) + '</td></tr></table>';
}
function panel(node) {
  var k = 0;
  var rows = node.steps.map(function (st, i) {
    if (typeof st === 'string') return '<tr><th colspan="3">' + st + '</th></tr>';
    var words = st.words || st[0], nums = st.nums || st[1];
    var last = i === node.steps.length - 1 && st.focus === undefined;
    var attrs = st.focus !== undefined ? ' data-focus="' + st.focus + '"' : '';
    k += 1;
    return '<tr' + (last ? ' class="result"' : '') + attrs + '><td class="n">' + k + '</td>' +
      '<td class="words">' + eqCell('\\displaystyle ' + words) + '</td><td class="nums">' + eqCell('\\displaystyle ' + nums) + '</td></tr>';
  }).join('');
  return '<div class="panel" id="' + node.id + '-panel"' + (openState[node.id] ? '' : ' hidden') + '>' +
    '<table class="steps"><tr><th></th><th>In words</th><th>With numbers</th></tr>' + rows + '</table></div>';
}

function update() {
  var oz = parseFloat(document.getElementById('oz').value) || 0;
  var hi = parseInt(document.getElementById('harm').value, 10);
  var e = buildEquation(oz, hi);
  var html = rowTable(e.A) + panel(e.A) + opRow('\u00d7') + rowTable(e.B) + panel(e.B) + opRow('=') + rowTable(e.C) + panel(e.C);
  var root = document.getElementById('tree');
  root.innerHTML = html;
  root.querySelectorAll('.eq').forEach(function (el) {
    var src = el.getAttribute('data-tex');
    if (typeof katex === 'undefined') { el.textContent = src; return; }
    katex.render(src, el, { displayMode: false, throwOnError: false, trust: function (c) { return c.command === '\\href'; } });
  });
}

function toggle(id) {
  var p = document.getElementById(id + '-panel');
  if (!p) return;
  openState[id] = p.hidden;
  p.hidden = !p.hidden;
  document.getElementById(id + '-glyph').innerHTML = p.hidden ? '&#9662;' : '&#9652;';
  document.querySelector('table[data-toggle="' + id + '"]').classList.toggle('open', !p.hidden);
}

document.addEventListener('click', function (e) {
  var a = e.target.closest('a');
  if (a) return;                                        // a source link: let it open
  var t = e.target.closest('table[data-toggle]');
  if (t) { toggle(t.getAttribute('data-toggle')); return; }
  var f = e.target.closest('tr[data-focus]');
  if (f) { document.getElementById('harm').value = f.getAttribute('data-focus'); update(); window.scrollTo(0, 0); }
});

function renderNotes() {
  var li = function (s) { return '<li>' + s + '</li>'; };
  return '<p><b>The harms</b> (Welfare Footprint Project, conventional fast-growing broilers). For each cause they combined how many birds are affected, how long it lasts and how intense it is, then summed over the bird\u2019s life of about 47 days. Lifetime is therefore not a separate multiplier: it is the window over which the hours accumulate.</p>' +
    '<ul>' + HARMS.map(function (h) { return li('<b>' + h[0] + '</b>: ' + h[4] + '.'); }).join('') + '</ul>' +
    '<p><b>The intensities</b> (<a href="' + SRC.defs + '">project definitions</a>):</p>' +
    '<ul>' + INTENSITIES.map(function (i) { return li('<b>' + i[0] + '</b>: ' + i[4] + '.'); }).join('') + '</ul>' +
    '<p><b>Uncertainty.</b> The project reports a mean and a 90% interval (5th to 95th percentile of many runs with every input varied over its plausible range); no median or 95% interval is published. The intervals are roughly \u00b140% around the mean and dominate the overall uncertainty; the weights and yields are industry averages good to about \u00b110%. Per-cause bounds exist in the project\u2019s dataset but are not loaded here yet. The by-cause and by-intensity totals differ by about 4% because they come from different releases of the same data.</p>' +
    '<p><b>Not included:</b> pain during transport and slaughter, breeder birds, and diseases the project did not model. The numbers are conservative.</p>' +
    '<p><b>Sources.</b></p><ol>' +
    li('Live weight: <a href="' + SRC.nass + '">USDA NASS, Poultry Production and Value 2024 Summary</a> (9.33 billion broilers, 61.1 billion lb).') +
    li('Dressing percentage 75%: <a href="' + SRC.umaine + '">University of Maine Extension, Understanding Poultry Yields</a>.') +
    li('Edible share percentage 74%: <a href="' + SRC.wisc + '">University of Wisconsin Extension, Bird Breakdown</a>.') +
    li('Raw meat per cooked gram 1.33 (cooking yield 0.75): <a href="' + SRC.cooking + '">USDA Table of Cooking Yields for Meat and Poultry</a>.') +
    li('Lifetime 47 days: <a href="' + SRC.ncc + '">National Chicken Council, U.S. Broiler Performance</a>.') +
    li('Hours of pain by intensity, mean and 90% interval: <a href="' + SRC.wfp + '">Welfare Footprint Institute, Broilers</a>, conventional scenario.') +
    li('Hours of pain by cause: <a href="' + SRC.track + '">Welfare Footprint Institute, Pain-Track for broilers</a>.') +
    '</ol>';
}

window.addEventListener('DOMContentLoaded', function () {
  var sel = document.getElementById('harm');
  HARMS.forEach(function (h, i) {
    var o = document.createElement('option'); o.value = i; o.textContent = h[0]; sel.appendChild(o);
  });
  sel.value = '0';   // default to lameness, the largest single harm
  document.getElementById('oz').addEventListener('input', update);
  sel.addEventListener('change', update);
  document.getElementById('notes-body').innerHTML = renderNotes();
  update();
});
</script>

</body>
</html>
