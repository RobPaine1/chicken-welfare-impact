<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What did this chicken cost?</title>
<link rel="stylesheet" href="site.css">
<style>
  h1 { margin-bottom: 0.2em; }
  .cols { display: flex; gap: 2em; flex-wrap: wrap; align-items: flex-start; }
  .cols > div { flex: 1 1 320px; }
  input[type=number] { font-size: 1.2em; width: 6em; padding: 0.2em 0.4em; }
  select { font-size: 1em; padding: 0.2em; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.4em; }
  .items button { position: relative; display: block; width: 100%; font: inherit; padding: 0; background: none; border: 0; cursor: pointer; transition: transform 0.15s ease; }
  .items button img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
  .items button.on img { filter: drop-shadow(0 0 5px #4a7fd0); }
  .items button span { position: absolute; left: 50%; top: 100%; transform: translate(-50%, -0.6em); width: max-content; max-width: 15em;
    background: rgba(255,255,255,0.96); border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    padding: 0.3em 0.6em; font-size: 0.88em; line-height: 1.3; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 2; }
  .items button small { color: #555; display: block; }
  .items button:hover, .items button:focus-visible { transform: scale(1.12); z-index: 3; outline: none; }
  .items button:hover span, .items button:focus-visible span, .items button.on span { opacity: 1; }
  @media (hover: none) { .items button span { position: static; transform: none; width: auto; max-width: none; opacity: 1; border: 0; box-shadow: none; background: none; } }
  #credits { font-size: 0.85em; color: #666; }
  #credits li { margin: 0.15em 0; }
  button.preset { font: inherit; padding: 0.35em 0.7em; background: #f6f6f6; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
  button.preset:hover { background: #ececec; }
  button.preset.on { background: #e4ecf7; border-color: #9bb7dd; }
  #headline { font-size: 1.35em; margin: 1.2em 0 0.4em; }
  #longrun { margin-top: 2.5em; padding-top: 1em; border-top: 2px solid #ddd; }
  #longrun h2:first-child { font-size: 1.35em; margin: 0 0 0.4em; }
  #long-question { font-size: 1.1em; }
  #long-question input { font-size: 1em; width: 3.5em; padding: 0.15em 0.3em; }
  #long-question select { font-size: 1em; }
  #long-headline { font-size: 1.35em; margin: 1em 0 0.4em; }
  #long-headline small { font-size: 0.7em; color: #555; }
  #long-causes .row, #long-causes .total { display: flex; gap: 0.5em; padding: 0.35em 0.5em; border-bottom: 1px solid #eee; }
  #long-causes .row .num { width: 8em; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: bold; }
  #long-causes .row .name { flex: 1; }
  #long-causes .row .range { color: #777; white-space: nowrap; font-size: 0.9em; }
  #headline small { font-size: 0.7em; color: #555; }
  h2 { font-size: 1.1em; margin: 0.8em 0 0.4em; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 0.3em 0.5em; border-bottom: 1px solid #eee; vertical-align: top; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; width: 8em; }
  td.range { color: #777; white-space: nowrap; width: 8em; font-size: 0.9em; }
  td.def { color: #555; font-size: 0.92em; }
  .muted { color: #666; font-size: 0.9em; }
  #result[hidden] { display: none; }
  #result { scroll-margin-top: 0.5em; }
  details.harm { border-bottom: 1px solid #eee; }
  details.harm summary { display: flex; gap: 0.5em; align-items: baseline; padding: 0.35em 0.5em; cursor: pointer; list-style: none; }
  details.harm summary::-webkit-details-marker { display: none; }
  details.harm summary .num { width: 8em; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: bold; }
  details.harm summary .name { flex: 1; }
  details.harm summary .name::before { content: '\25BE\00a0'; color: #888; }
  details.harm[open] summary .name::before { content: '\25B4\00a0'; }
  details.harm summary .range { color: #777; white-space: nowrap; font-size: 0.9em; }
  details.harm .desc { margin: 0 0.5em 0.6em 8.5em; color: #444; font-size: 0.92em; }
  .total { padding: 0.35em 0.5em; display: flex; gap: 0.5em; }
  details.harm .desc a.thumb { float: right; width: 140px; margin: 0 0 0.5em 1em; }
  details.harm .desc a.thumb img { display: block; width: 100%; border-radius: 4px; }
  details.harm .desc table.parts { clear: both; }
  .parts-heading { margin: 0.6em 0 0.2em; font-weight: bold; color: #333; }
  details.harm .desc table.parts { width: calc(100% + 8em); margin-left: -8em; }
  table.parts td { padding: 0.25em 0.5em; border-bottom: 1px solid #f0f0f0; font-size: 0.95em; }
  table.parts td.num { width: 7em; font-weight: bold; text-align: right; white-space: nowrap; }
  table.parts .what { display: block; color: #666; font-size: 0.92em; }
  table.parts td.range { width: auto; white-space: nowrap; color: #777; font-size: 0.9em; text-align: right; }
  .total .num { width: 8em; text-align: right; font-weight: bold; }
</style>
</head>
<body data-page="calculator">
<nav class="side" id="side"></nav>
<main>
<h1 id="title"></h1>

<div class="cols">
  <div>
    <p><b id="type-heading"></b></p>
    <p><input type="number" id="amount" min="0" step="0.5" placeholder="0"> <select id="unit"><option value="oz">oz</option><option value="g">grams</option></select></p>
    <p class="muted" id="type-hint"></p>
    <p><button type="button" id="preset" class="preset"></button><br><small class="muted" id="preset-note"></small></p>
  </div>
  <div>
    <p><b id="pick-heading"></b></p>
    <div class="items" id="items"></div>
    <p class="muted" id="pick-hint"></p>
  </div>
</div>

<div id="result" hidden>
  <p id="headline"></p>
  <div class="cols">
    <div>
      <h2 id="causes-heading"></h2>
      <div id="causes"></div>
    </div>
    <div>
      <h2 id="levels-heading"></h2>
      <table id="levels"></table>
      <p class="muted" id="levels-note"></p>
    </div>
  </div>
  <p class="muted" id="foot"></p>

  <div id="longrun">
    <h2 id="long-heading"></h2>
    <p id="long-question"></p>
    <p id="long-headline"></p>
    <div class="cols">
      <div>
        <h2 id="long-causes-heading"></h2>
        <div id="long-causes"></div>
      </div>
      <div>
        <h2 id="long-levels-heading"></h2>
        <table id="long-levels"></table>
        <p class="muted" id="long-levels-note"></p>
      </div>
    </div>
  </div>
</div>

<p class="muted" id="caveat"></p>
<details id="credits"><summary id="credits-heading"></summary><ul id="credits-list"></ul></details>

</main>
<script src="text.js"></script>
<script src="nav.js"></script>
<script src="photos.js"></script>
<script src="wfp.js"></script>
<script src="chicken.js"></script>
<script>
var ITEMS = TEXT.plate.items;
var P = TEXT.plate;

function n(x, d) { return Number(x.toFixed(d === undefined ? 1 : d)).toLocaleString('en-US'); }
function dur(h) {
  if (h === 0) return '0 hours';
  if (h < 1 / 60) return n(h * 3600, h * 3600 < 10 ? 1 : 0) + ' seconds';
  if (h < 1) return n(h * 60, 0) + ' minutes';
  if (h < 10) return n(h, 1) + ' hours';
  return n(h, 0) + ' hours';
}
function durRange(lo, hi) {
  if (hi === 0) return '';
  var unit = hi < 1 / 60 ? 3600 : hi < 1 ? 60 : 1;
  var d = hi * unit < 10 ? 1 : 0;
  var u = unit === 3600 ? ' s' : unit === 60 ? ' min' : ' h';
  return fmt(P.rangeLine, { lo: n(lo * unit, d), hi: n(hi * unit, d) + u });
}
// Durations for the long-run block, where hours run into the thousands.
function durBig(h) {
  if (h >= 2 * 8760) return n(h / 8760, h / 8760 < 10 ? 1 : 0) + ' years';
  if (h >= 48) return n(h / 24, 0) + ' days';
  return dur(h);
}
function durRangeBig(lo, hi, mean) {   // same unit as durBig(mean), so the range reads with the number beside it
  if (hi === 0) return '';
  if (mean >= 2 * 8760) return fmt(P.rangeLine, { lo: n(lo / 8760, lo / 8760 < 10 ? 1 : 0), hi: n(hi / 8760, hi / 8760 < 10 ? 1 : 0) + ' years' });
  if (mean >= 48) return fmt(P.rangeLine, { lo: n(lo / 24, 0), hi: n(hi / 24, 0) + ' days' });
  return durRange(lo, hi);
}
function frac(x) { return x > 0 && x < 0.67 ? 'about 1/' + Math.round(1 / x) : n(x, 2); }

function currentGrams() {
  var v = parseFloat(document.getElementById('amount').value);
  if (!(v > 0)) return 0;
  return document.getElementById('unit').value === 'oz' ? v * OZ_TO_G : v;
}

function render() {
  var g = currentGrams();
  var box = document.getElementById('result');
  if (!(g > 0)) { box.hidden = true; return; }
  var sysKey = 'conventional';   // nearly all chicken sold is conventional; the Equation page has the comparison
  var st = servingStats(g, sysKey);
  box.hidden = false;

  var vars = { days: n(st.days, st.days < 10 ? 1 : 0), daysLo: n(st.daysLo, st.daysLo < 10 ? 1 : 0), daysHi: n(st.daysHi, st.daysHi < 10 ? 1 : 0), farm: TEXT.systems[sysKey].farm, fraction: frac(st.lifetimes), lifetime: st.lifetimeDays, grams: n(st.cookedG, 0),
               amount: document.getElementById('amount').value + ' ' + (document.getElementById('unit').value === 'oz' ? 'oz' : 'g'),
               item: presetOn ? P.presetItem : pickedItem === null ? '' : fmt(P.headlineItem, { name: itemName(ITEMS[pickedItem][0]), a: /^(\d|half )/i.test(ITEMS[pickedItem][0]) ? '' : 'a ' }) };
  document.getElementById('headline').innerHTML = fmt(P.headline, vars) + '<br><small>' + fmt(P.headlineSmall, vars) + '</small>';

  var openHarms = {};
  document.querySelectorAll('#causes details[open]').forEach(function (d) { openHarms[d.getAttribute('data-name')] = true; });
  document.getElementById('causes').innerHTML = st.causes.slice().sort(function (a, b) { return b.hours - a.hours; }).map(function (c) {
    var what = c.what.charAt(0).toUpperCase() + c.what.slice(1);
    return '<details class="harm" data-name="' + c.name + '"' + (openHarms[c.name] ? ' open' : '') + '><summary>' +
      '<span class="num">' + dur(c.hours) + '</span><span class="name">' + fmt(P.causeLine, { harm: c.name.toLowerCase() }) + '</span><span class="range">' + durRange(c.lo, c.hi) + '</span></summary>' +
      '<div class="desc">' + (TEXT.harmsPage.photos[c.name] ? '<a class="thumb" href="harms/' + harmSlug(c.name) + '.html"><img src="' + TEXT.harmsPage.photos[c.name][0] + '" alt="" loading="lazy"></a>' : '') +
      fmt(P.causeDetail, { what: what, perBird: dur(c.perBird), fraction: frac(st.lifetimes) }) +
      ' <a href="harms/' + harmSlug(c.name) + '.html">' + P.causeLink + '</a>' + partsTable(c) + '</div></details>';
  }).join('') + '<div class="total"><span class="num">' + dur(st.allHours) + '</span><span>' + P.totalLine + '</span></div>';

  document.getElementById('levels').innerHTML = st.levels.slice().reverse().map(function (l) {
    return '<tr><td class="num"><b>' + dur(l.hours) + '</b></td><td>' + fmt(P.levelLine, { level: l.name.toLowerCase(), definition: l.def }) + '</td><td class="range">' + durRange(l.lo, l.hi) + '</td></tr>';
  }).join('');

  document.getElementById('foot').innerHTML = P.footnote;
  renderLongRun(st);
}

// The block at the bottom: this meal, so many times a week, for so many years.
function renderLongRun(st) {
  var L = P.longrun;
  var times = parseFloat(document.getElementById('times').value), years = parseFloat(document.getElementById('years').value);
  var box = document.getElementById('longrun');
  if (!(times > 0) || !(years > 0)) { document.getElementById('long-headline').innerHTML = ''; document.getElementById('long-causes').innerHTML = ''; document.getElementById('long-levels').innerHTML = ''; return; }
  var meals = times * 52 * years;
  var chickens = st.lifetimes * meals;
  var vars = { times: n(times, times % 1 ? 1 : 0), years: n(years, 0), meals: n(meals, 0),
               chickens: n(chickens, chickens < 10 ? 1 : 0), chickensLo: n(st.lifetimesLo * meals, 0), chickensHi: n(st.lifetimesHi * meals, 0),
               perYear: n(st.cookedG * times * 52 / 453.6, 0), perYearKg: n(st.cookedG * times * 52 / 1000, 0) };
  document.getElementById('long-headline').innerHTML = fmt(presetOn && L.headlinePreset ? L.headlinePreset : L.headline, vars) + '<br><small>' + fmt(L.headlineSmall, vars) + '</small>';
  document.getElementById('long-causes').innerHTML = st.causes.slice().sort(function (a, b) { return b.hours - a.hours; }).map(function (c) {
    return '<div class="row"><span class="num">' + durBig(c.hours * meals) + '</span><span class="name">' + fmt(P.causeLine, { harm: c.name.toLowerCase() }) +
      '</span><span class="range">' + durRangeBig(c.lo * meals, c.hi * meals, c.hours * meals) + '</span></div>';
  }).join('') + '<div class="total"><span class="num">' + durBig(st.allHours * meals) + '</span><span>' + P.totalLine + '</span></div>';
  document.getElementById('long-levels').innerHTML = st.levels.slice().reverse().map(function (l) {
    return '<tr><td class="num"><b>' + durBig(l.hours * meals) + '</b></td><td>' + fmt(P.levelLine, { level: l.name.toLowerCase(), definition: l.def }) + '</td><td class="range">' + durRangeBig(l.lo * meals, l.hi * meals, l.hours * meals) + '</td></tr>';
  }).join('');
}

// The kinds within a harm (gait scores, fatal or not, week of life), shown inside its dropdown.
function partsTable(c) {
  if (!c.parts || c.parts.length < 2) return '';
  return '<p class="parts-heading">' + P.partsHeading + '</p><table class="parts">' + c.parts.map(function (pt) {
    return '<tr><td class="num">' + dur(pt.hours) + '</td><td>' + pt.name + (pt.what ? '<span class="what">' + pt.what + '</span>' : '') +
           '</td><td class="range">' + durRange(pt.lo, pt.hi) + '</td></tr>';
  }).join('') + '</table>';
}
// Keep an item's hover label inside the window when the item sits at an edge.
function placeLabel(b) {
  var sp = b.querySelector('span'); if (!sp) return;
  sp.style.left = ''; sp.style.right = ''; sp.style.transform = '';
  var r = sp.getBoundingClientRect(), vw = document.documentElement.clientWidth;
  if (r.right > vw - 4) { sp.style.left = 'auto'; sp.style.right = '0'; sp.style.transform = 'translate(0, -0.6em)'; }
  else if (r.left < 4) { sp.style.left = '0'; sp.style.transform = 'translate(0, -0.6em)'; }
}
// Slide down to the results once they are shown.
var SCROLL_MS = 1600;   // how long the slide down to the results takes
function scrollToResult() {
  var box = document.getElementById('result');
  if (box.hidden) return;
  var start = window.scrollY, target = start + box.getBoundingClientRect().top - 8, t0 = null;
  var max = document.documentElement.scrollHeight - window.innerHeight;
  if (target > max) target = max;
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function step(ts) {
    if (t0 === null) t0 = ts;
    var f = Math.min(1, (ts - t0) / SCROLL_MS);
    window.scrollTo(0, start + (target - start) * ease(f));
    if (f < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
// An item's name as it reads mid-sentence: first letter lower-cased unless it starts with a brand name.
function itemName(name) {
  var brand = (P.brands || []).some(function (b) { return name.indexOf(b) === 0; });
  return brand ? name : name.charAt(0).toLowerCase() + name.slice(1);
}
var pickedItem = null;   // index into ITEMS of the picked common item, or null when an amount was typed
var presetOn = false;    // true when the typical-American week preset was chosen
function usePreset() {
  var unit = document.getElementById('unit').value;
  document.getElementById('amount').value = unit === 'oz' ? Math.round(US_COOKED_G_PER_WEEK / OZ_TO_G * 10) / 10 : Math.round(US_COOKED_G_PER_WEEK);
  document.getElementById('times').value = 1;
  pickedItem = null; presetOn = true;
  document.querySelectorAll('.items button').forEach(function (b) { b.classList.remove('on'); });
  document.getElementById('preset').classList.add('on');
  render();
  scrollToResult();
}
function pick(i) {
  var it = ITEMS[i];
  pickedItem = i; presetOn = false; document.getElementById('preset').classList.remove('on');
  var unit = document.getElementById('unit').value;
  document.getElementById('amount').value = unit === 'oz' ? Math.round(it[1] / OZ_TO_G * 10) / 10 : it[1];
  document.querySelectorAll('.items button').forEach(function (b, j) { b.classList.toggle('on', j === i); });
  placeLabel(document.querySelectorAll('.items button')[i]);
  render();
  scrollToResult();
}

window.addEventListener('DOMContentLoaded', function () {
  document.title = P.title;
  [['title', P.title], ['caveat', P.caveat],
   ['type-heading', P.typeHeading], ['type-hint', P.typeHint], ['pick-heading', P.pickHeading], ['pick-hint', P.pickHint],
   ['causes-heading', P.causesHeading], ['levels-heading', P.levelsHeading], ['levels-note', P.levelsNote], ['long-levels-note', P.longrun.levelsNote]].forEach(function (x) { document.getElementById(x[0]).innerHTML = x[1]; });
  var L = P.longrun;
  ['long-heading', 'long-causes-heading', 'long-levels-heading'].forEach(function (id, i) { document.getElementById(id).innerHTML = [L.heading, L.causesHeading, L.levelsHeading][i]; });
  document.getElementById('long-question').innerHTML = fmt(L.question, {
    times: '<input type="number" id="times" min="0" step="0.5" value="' + L.defaultTimes + '">',
    years: '<select id="years">' + L.yearsOptions.map(function (y) { return '<option value="' + y + '"' + (y === L.defaultYears ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>' });
  document.getElementById('times').addEventListener('input', render);
  document.getElementById('years').addEventListener('change', render);
  document.getElementById('credits-heading').textContent = P.photoCredits;
  var cl = document.getElementById('credits-list');
  ITEMS.forEach(function (it) {
    var ph = it[3] && typeof PHOTOS !== 'undefined' && PHOTOS[it[3]];
    if (!ph) return;
    var li = document.createElement('li');
    li.innerHTML = it[0] + ': <a href="' + ph.page + '">' + ph.title + '</a> by ' + ph.author + ', <a href="' + ph.licenseUrl + '">' + ph.license + '</a>, via Wikimedia Commons' + (ph.note ? ' (' + ph.note + ')' : '') + '.';
    cl.appendChild(li);
  });
  Object.keys(TEXT.harmsPage.photos || {}).forEach(function (name) {
    var f = TEXT.harmsPage.photos[name][0], ph = typeof PHOTOS !== 'undefined' && PHOTOS[f];
    if (!ph) return;
    var li = document.createElement('li');
    li.innerHTML = name + ': <a href="' + ph.page + '">' + ph.title + '</a> by ' + ph.author + ', <a href="' + ph.licenseUrl + '">' + ph.license + '</a>, via Wikimedia Commons.';
    cl.appendChild(li);
  });
  if (!cl.children.length) document.getElementById('credits').hidden = true;
  var presetVars = { oz: n(US_COOKED_G_PER_WEEK / OZ_TO_G, 1), g: n(US_COOKED_G_PER_WEEK, 0), lb: n(US_BONELESS_LB_PER_YEAR, 1) };
  document.getElementById('preset').textContent = fmt(P.presetLabel, presetVars);
  document.getElementById('preset-note').innerHTML = fmt(P.presetNote, presetVars) + (P.presetSource ? ' <a href="' + P.presetSource + '">Source.</a>' : '');
  document.getElementById('preset').addEventListener('click', usePreset);
  var items = document.getElementById('items');
  ITEMS.forEach(function (it, i) {
    var b = document.createElement('button');
    b.innerHTML = (it[3] ? '<img src="' + it[3] + '" alt="' + it[0] + '" loading="lazy">' : '') +
      '<span>' + it[0] + '<small>' + fmt(P.itemAmount, { oz: n(it[1] / OZ_TO_G, 1) }) + (it[2] ? ', ' + it[2] : '') + '</small></span>';
    b.title = it[0];
    b.addEventListener('click', function () { pick(i); });
    b.addEventListener('mouseenter', function () { placeLabel(b); });
    b.addEventListener('focus', function () { placeLabel(b); });
    items.appendChild(b);
  });
  var amount = document.getElementById('amount');
  amount.addEventListener('input', function () {
    pickedItem = null; presetOn = false; document.getElementById('preset').classList.remove('on');
    document.querySelectorAll('.items button').forEach(function (b) { b.classList.remove('on'); });
    var wasHidden = document.getElementById('result').hidden;
    render();
    if (wasHidden) scrollToResult();   // slide down the first time a result appears; later keystrokes stay put
  });
  amount.addEventListener('change', scrollToResult);   // Enter or leaving the box
  amount.addEventListener('keydown', function (e) { if (e.key === 'Enter') { amount.blur(); scrollToResult(); } });
  document.getElementById('unit').addEventListener('change', function () {
    var a = document.getElementById('amount'); var v = parseFloat(a.value);
    if (v > 0) a.value = document.getElementById('unit').value === 'oz' ? Math.round(v / OZ_TO_G * 10) / 10 : Math.round(v * OZ_TO_G);
    render();
  });
  render();
});
</script>

</body>
</html>
