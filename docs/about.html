<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About</title>
<link rel="stylesheet" href="site.css">
<style>
  main { max-width: 42em; }
  h1 { margin-bottom: 0.2em; }
</style>
</head>
<body data-page="about">
<nav class="side" id="side"></nav>
<main>
  <h1 id="title"></h1>
  <div id="body"></div>
</main>
<script src="text.js"></script>
<script src="nav.js"></script>
<script>
  document.title = TEXT.about.title;
  document.getElementById('title').textContent = TEXT.about.title;
  document.getElementById('body').innerHTML = TEXT.about.paragraphs.map(function (p) { return '<p>' + p + '</p>'; }).join('');
</script>
</body>
</html>
