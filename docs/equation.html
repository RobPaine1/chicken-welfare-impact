<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken welfare calculator</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<style>
  body { max-width: 1100px; margin: 1em auto; padding: 0 1em; }
  /* The equation rows: capped in width so the words and their number stay close; each column centred. */
  table.row { width: 100%; max-width: 820px; }
  table.row td.words, table.row td.nums { text-align: center; }
  table.row td.glyph { color: #555; }
  table[data-toggle], tr[data-focus] { cursor: pointer; }
  table[data-toggle]:hover, tr[data-focus]:hover { background: #f3f3f3; }
  table[data-toggle].open { background: #f3f3f3; }
  /* A term's worked steps, shown directly beneath its row. */
  .panel { margin: 0.4em 0 1em 24px; }
  table.steps { width: 100%; border-collapse: collapse; }
  table.steps th { text-align: left; font-weight: normal; color: #666; font-size: 0.85em; padding: 0.3em 0.6em; border-bottom: 1px solid #bbb; }
  table.steps td { padding: 0.45em 0.6em; border-bottom: 1px solid #e2e2e2; vertical-align: middle; }
  table.steps td.n { width: 1.5em; color: #888; text-align: right; }
  table.steps td.words { width: 55%; }
  table.steps tr.result td { font-weight: bold; }
  /* Each quantity that is produced on one line and used on another gets its own colour,
     applied to both its words and its number. */
  .k-cooked   { color: #a67c00; }
  .k-rawserv  { color: #d35400; }
  .k-live     { color: #1e6fb8; }
  .k-rawlife  { color: #2e8b57; }
  .k-lifeserv { color: #6a3fc9; }
  .k-harmlife { color: #d81b60; }
  .k-allharms { color: #00838f; }
  .k-lifetime { color: #616161; }
  .k-harmserv { color: #b71c1c; }
  .k-allserv  { color: #8d6e63; }
  .nav { color: #666; }
  #notes { margin-top: 2em; font-size: 0.95em; color: #333; }
  #notes summary { cursor: pointer; }
</style>
</head>
<body>

<p class="nav"><a href="index.html" id="nav-calc"></a> &middot; <b id="nav-eq"></b> &middot; <a href="harms.html" id="nav-harms"></a></p>
<h1 id="title"></h1>

<p>
  <span id="serving-before"></span> <input type="number" id="oz" value="6" min="0" step="0.5" size="4"> <span id="serving-after"></span>
  &nbsp; <span id="chicken-label"></span> <select id="system"></select>
  &nbsp; <span id="harm-label"></span> <select id="harm"></select>
</p>

<p id="intro"></p>

<div id="tree"></div>

<details id="notes">
<summary id="notes-summary"></summary>
<div id="notes-body"></div>
</details>

<script src="text.js"></script>
<script src="wfp.js"></script>
<script src="chicken.js"></script>
<script>
// ---------------------------------------------------------------------------
// Sources
// ---------------------------------------------------------------------------
var SRC = {
  nass:    'https://www.nass.usda.gov/Publications/Todays_Reports/reports/plva0425.pdf',
  umaine:  'https://extension.umaine.edu/publications/2223e/',
  wisc:    'https://livestock.extension.wisc.edu/articles/bird-breakdown-exploring-yields-and-cuts-of-poultry/',
  cooking: 'https://www.ars.usda.gov/ARSUserFiles/80400525/data/retn/usda_cookingyields_meatpoultry.pdf',
  sr28:    'https://www.ars.usda.gov/northeast-area/beltsville-md-bhnrc/beltsville-human-nutrition-research-center/methods-and-application-of-food-composition-laboratory/mafcl-site-pages/sr11-sr28/',
  ncc:     'https://www.nationalchickencouncil.org/about-the-industry/statistics/u-s-broiler-performance/',
  wfp:     'https://welfarefootprint.org/broilers/',
  track:   'https://pain-track.org/broilers',
  tableau: 'https://public.tableau.com/app/profile/cynthia.schuck/viz/BroilerChickens2021/Broilers',
  defs:    'https://welfarefootprint.org/technical-definitions/pain-intensities/'
};

// ---------------------------------------------------------------------------
// Formatting helpers
// ---------------------------------------------------------------------------
function n(x, d) { return Number(x.toFixed(d === undefined ? 1 : d)).toLocaleString('en-US'); }
function tex(x, d) { return n(x, d).replace(/,/g, '{,}'); }
function T(words) { return '\\text{' + words + '}'; }
function F(top, bottom) { return '\\frac{' + T(top) + '}{' + T(bottom) + '}'; }          // word fraction
function G(x) { return tex(x, 0) + '\\ \\text{g}'; }
function H(x) { return x + '\\ \\text{h}'; }
function hrs(h) {
  if (h === 0) return '0\\ \\text{h}';
  if (h < 1 / 60) return tex(h * 3600) + '\\ \\text{s}';
  if (h < 1) return tex(h * 60) + '\\ \\text{min}';
  return tex(h) + '\\ \\text{h}';
}
function range(lo, hi) {
  if (hi === 0) return '';
  var unit = hi < 1 / 60 ? 's' : hi < 1 ? 'min' : 'h';
  var k = unit === 's' ? 3600 : unit === 'min' ? 60 : 1;
  return '[\\,' + tex(lo * k) + '\\text{–}' + tex(hi * k) + '\\ \\text{' + unit + '}\\,]';
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
var TIMES = ' \\times ', DIV = ' \\div ', EQ = ' = ', PLUS = ' + ';
function K(key, body) { return '\\htmlClass{k-' + key + '}{' + body + '}'; }   // colour a term
function smallRange(lo, hi) { var r = range(lo, hi); return r ? '\\ {\\small ' + r + '}' : ''; }
function S(tag, body) { return body + '_{\\text{' + tag + '}}'; }                      // source tag as a subscript

// ---------------------------------------------------------------------------
// The equation: three rows, each with an optional table of worked steps.
// A step is [words, numbers] (both LaTeX) or a heading string.
// ---------------------------------------------------------------------------
function buildEquation(oz, sysKey, hi) {     // hi = index into the system's causes, or -1 for all harms
  var sys = SYSTEMS[sysKey];
  var data = WFP.systems[sysKey];
  var causes = data.causes;
  var st = servingStats(oz * OZ_TO_G, sysKey);
  var allTotal = st.allPerBird, allLo = st.allPerBirdLo, allHi = st.allPerBirdHi;
  var cookedG = st.cookedG, rawG = st.rawG, rawPerBird = st.rawPerBird, lifetimes = st.lifetimes;
  var gRange = '[\\,' + tex(st.rawPerBirdLo, 0) + '\\text{–}' + tex(st.rawPerBirdHi, 0) + '\\ \\text{g}\\,]';
  var fRange = '[\\,' + tex(st.lifetimesLo, 3) + '\\text{–}' + tex(st.lifetimesHi, 3) + '\\,]';
  var lx = tex(lifetimes, 3);
  var approx = lifetimes > 0 && lifetimes < 0.67 ? ' \\approx \\tfrac{1}{' + Math.round(1 / lifetimes) + '}' : '';
  var lifeH = sys.lifetimeDays * 24;

  // Reused quantities, each with its words, its number, and a tint.
  var cooked   = { w: K('cooked',   F('Cooked Meat', 'Serving')),         n: K('cooked',   G(cookedG)) };
  var rawserv  = { w: K('rawserv',  F('Raw Meat', 'Serving')),            n: K('rawserv',  G(rawG)) };
  var live     = { w: K('live',     F('Live Weight', 'Animal')),          n: K('live',     G(sys.liveG)) };
  var rawlife  = { w: K('rawlife',  F('Raw Meat', 'Animal Lifetime')),    n: K('rawlife',  G(rawPerBird)) };
  var lifeserv = { w: K('lifeserv', F('Animal Lifetime', 'Serving')),     n: K('lifeserv', lx + '\\ \\text{chickens}') };
  var allharms = { w: K('allharms', F('All Harms', 'Animal Lifetime')),   n: K('allharms', hrs(allTotal)) };
  var lifetime = { w: K('lifetime', T('Animal Lifetime')),                n: K('lifetime', H(tex(lifeH, 0))) };
  var allserv  = { w: K('allserv',  F('All Harms', 'Serving')),           n: K('allserv',  hrs(allTotal * lifetimes)) };

  var liveStep = sysKey === 'conventional'
    ? [live.w + EQ + F('Live Weight Produced', 'Year') + DIV + F('Animals Produced', 'Year'),
       live.n + EQ + S('NASS', '61.1 \\times 10^{9}\\ \\text{lb}') + DIV + S('NASS', '9.33 \\times 10^{9}')]
    : [live.w + EQ + T('slower-growing breed at market age'), live.n + EQ + S('WFP', '2.5\\ \\text{kg}')];

  var A = {
    id: 'lifetimes-per-serving', name: F('Animal Lifetime', 'Serving'), value: lx + '\\ \\text{chickens}' + approx + '\\ {\\small ' + fRange + '}',
    tip: 'How many chickens\u2019 worth of meat is on the plate.',
    steps: [
      [cooked.w + EQ + T('Ounces Eaten') + TIMES + T('Grams per Ounce'),
       cooked.n + EQ + tex(oz) + '\\ \\text{oz}' + TIMES + '28.35\\ \\text{g/oz}'],
      [rawserv.w + EQ + cooked.w + TIMES + F('Raw Meat', 'Cooked Meat'),
       rawserv.n + EQ + cooked.n + TIMES + S('ARS', tex(1 / COOKING_YIELD, 2))],
      liveStep,
      [rawlife.w + EQ + live.w + TIMES + T('Dressing \\%') + TIMES + T('Edible Share \\%'),
       rawlife.n + '\\ ' + gRange + EQ + live.n + TIMES + tex(DRESSING * 100, 1) + '\\%_{\\text{UWisc}\\,[72\\text{–}75]}' + TIMES + tex(EDIBLE_SHARE * 100, 0) + '\\%_{\\text{SR28}\\,[48\\text{–}68]}'],
      [lifeserv.w + EQ + rawserv.w + DIV + rawlife.w,
       lifeserv.n + '\\ ' + fRange + EQ + rawserv.n + DIV + rawlife.n + '\\ ' + gRange]
    ]
  };

  var lifetimeStep = [lifetime.w + EQ + T('Days Alive') + TIMES + T('Hours per Day'),
                      lifetime.n + EQ + S(sys.lifeTag, sys.lifetimeDays + '\\ \\text{days}') + TIMES + '24\\ \\text{h/day}'];
  var pub = data.published;
  var intensitySteps = [
    TEXT.equation.intensityHeading
  ].concat(LEVELS.map(function (l) {
    return [F(LEVEL_NAMES[l], 'Animal Lifetime'), S('WFP', hrs(pub[l].mean)) + '\\ ' + range(pub[l].lo, pub[l].hi)];
  })).concat([
    [F('All Intensities', 'Animal Lifetime') + EQ + LEVELS.map(function (l) { return T(LEVEL_NAMES[l]); }).join(PLUS),
     hrs(LEVELS.reduce(function (s, l) { return s + pub[l].mean; }, 0)) + '\\ ' + range(allLo, allHi)]
  ]);

  var B, C;
  if (hi >= 0) {
    var h = causes[hi];
    var harmlife = { w: K('harmlife', F(h.name, 'Animal Lifetime')), n: K('harmlife', hrs(h.total)) };
    var harmserv = { w: K('harmserv', F(h.name, 'Serving')),         n: K('harmserv', hrs(h.total * lifetimes)) };
    var hs = st.scaled(h.total, h.total_lo, h.total_hi);
    B = {
      id: 'harm-per-lifetime', name: F(h.name, 'Animal Lifetime'), value: S('WFP', hrs(h.total)) + smallRange(h.total_lo, h.total_hi),
      tip: h.name + ': ' + harmWhat(h) + '. Hours an average bird spends in this pain over its life (Welfare Footprint Project).',
      steps: [
        [harmlife.w + EQ + LEVELS.map(function (l) { return T(LEVEL_NAMES[l]); }).join(PLUS),
         harmlife.n + EQ + LEVELS.map(function (l) { return hrs(h.mean[l]); }).join(PLUS) + '_{\\text{WFP}}\\ ' + range(h.total_lo, h.total_hi)],
        lifetimeStep,
        [F('Time in ' + h.name, 'Animal Lifetime') + EQ + harmlife.w + DIV + lifetime.w,
         tex(h.total / lifeH * 100, 0) + '\\%' + EQ + harmlife.n + DIV + lifetime.n]
      ]
    };
    C = {
      id: 'harm-per-serving', name: F(h.name, 'Serving'), value: '\\mathbf{' + hrs(hs.hours) + '}' + smallRange(hs.lo, hs.hi),
      tip: 'Hours of ' + h.name.toLowerCase() + ' behind this serving.',
      steps: [[harmserv.w + EQ + lifeserv.w + TIMES + harmlife.w,
               harmserv.n + '\\ ' + range(hs.lo, hs.hi) + EQ + lifeserv.n + '\\ ' + fRange + TIMES + harmlife.n + '\\ ' + range(h.total_lo, h.total_hi)]]
    };
  } else {
    var sumW = causes.map(function (c) { return T(c.name); }).join(PLUS);
    var sumN = causes.map(function (c) { return tex(c.total); }).join(PLUS) + '\\ \\text{h}_{\\text{WFP}}';
    B = {
      id: 'harm-per-lifetime', name: F('All Harms', 'Animal Lifetime'), value: hrs(allTotal) + smallRange(allLo, allHi),
      tip: 'Hours an average bird spends in pain over its life, all causes added (Welfare Footprint Project).',
      steps: [
        [allharms.w + EQ + sumW, allharms.n + EQ + sumN],
        lifetimeStep,
        [F('Time in Pain', 'Animal Lifetime') + EQ + allharms.w + DIV + lifetime.w,
         tex(allTotal / lifeH * 100, 0) + '\\%' + EQ + allharms.n + DIV + lifetime.n]
      ].concat(intensitySteps)
    };
    C = {
      id: 'harm-per-serving', name: F('All Harms', 'Serving'), value: '\\mathbf{' + hrs(st.allHours) + '}' + smallRange(st.allLo, st.allHi),
      tip: 'Hours of pain of all kinds behind this serving. Open to see it by cause.',
      steps: [[allserv.w + EQ + lifeserv.w + TIMES + allharms.w,
               allserv.n + '\\ ' + range(st.allLo, st.allHi) + EQ + lifeserv.n + '\\ ' + fRange + TIMES + allharms.n + '\\ ' + range(allLo, allHi)],
              TEXT.equation.byCauseHeading].concat(causes.map(function (c, i) {
        var cs = st.scaled(c.total, c.total_lo, c.total_hi);
        return { focus: i, words: F(c.name, 'Serving') + EQ + lifeserv.w + TIMES + F(c.name, 'Animal Lifetime'),
                 nums: hrs(cs.hours) + '\\ ' + range(cs.lo, cs.hi) + EQ + lifeserv.n + TIMES + hrs(c.total) + '\\ ' + range(c.total_lo, c.total_hi) };
      }))
    };
  }
  return { A: A, B: B, C: C };
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
var openState = {};

function eqCell(src) { return '<span class="eq" data-tex="' + esc(src) + '"></span>'; }
function big(s) { return '<big><big>' + s + '</big></big>'; }
function rowTable(node) {
  var open = !!openState[node.id];
  return '<table width="100%" class="row' + (open ? ' open' : '') + '" data-toggle="' + node.id + '" title="' + esc(node.tip || '') + '"><tr>' +
    '<td width="24" class="glyph" align="center">' + big('<span id="' + node.id + '-glyph">' + (open ? '&#9652;' : '&#9662;') + '</span>') + '</td>' +
    '<td width="50%" class="words">' + big(eqCell('\\displaystyle ' + node.name)) + '</td>' +
    '<td width="50%" class="nums">' + big(eqCell('\\displaystyle ' + node.value)) + '</td></tr></table>';
}
function opRow(op) {
  return '<table width="100%" class="row"><tr><td width="24"></td>' +
    '<td width="50%" class="words">' + big(op) + '</td><td width="50%" class="nums">' + big(op) + '</td></tr></table>';
}
function panel(node) {
  var k = 0;
  var rows = node.steps.map(function (st, i) {
    if (typeof st === 'string') return '<tr><th colspan="3">' + st + '</th></tr>';
    var words = st.words || st[0], nums = st.nums || st[1];
    var last = i === node.steps.length - 1 && st.focus === undefined;
    var attrs = st.focus !== undefined ? ' data-focus="' + st.focus + '"' : '';
    k += 1;
    return '<tr' + (last ? ' class="result"' : '') + attrs + '><td class="n">' + k + '</td>' +
      '<td class="words">' + eqCell('\\displaystyle ' + words) + '</td><td class="nums">' + eqCell('\\displaystyle ' + nums) + '</td></tr>';
  }).join('');
  return '<div class="panel" id="' + node.id + '-panel"' + (openState[node.id] ? '' : ' hidden') + '>' +
    '<table class="steps"><tr><th></th><th>' + TEXT.equation.inWords + '</th><th>' + TEXT.equation.withNumbers + '</th></tr>' + rows + '</table></div>';
}

function fillHarmOptions() {
  var sel = document.getElementById('harm');
  var keep = sel.value || '-1';
  sel.innerHTML = '<option value="-1">' + TEXT.equation.allHarms + '</option>';
  WFP.systems[document.getElementById('system').value].causes.forEach(function (c, i) {
    var o = document.createElement('option'); o.value = i; o.textContent = c.name; sel.appendChild(o);
  });
  sel.value = keep;
}

function update() {
  var oz = parseFloat(document.getElementById('oz').value) || 0;
  var sysKey = document.getElementById('system').value;
  var hi = parseInt(document.getElementById('harm').value, 10);
  var e = buildEquation(oz, sysKey, hi);
  var html = rowTable(e.A) + panel(e.A) + opRow('\u00d7') + rowTable(e.B) + panel(e.B) + opRow('=') + rowTable(e.C) + panel(e.C);
  var root = document.getElementById('tree');
  root.innerHTML = html;
  root.querySelectorAll('.eq').forEach(function (el) {
    var src = el.getAttribute('data-tex');
    if (typeof katex === 'undefined') { el.textContent = src; return; }
    katex.render(src, el, { displayMode: false, throwOnError: false, strict: false, trust: function (c) { return c.command === '\\href' || c.command === '\\htmlClass'; } });
  });
}

function toggle(id) {
  var p = document.getElementById(id + '-panel');
  if (!p) return;
  openState[id] = p.hidden;
  p.hidden = !p.hidden;
  document.getElementById(id + '-glyph').innerHTML = p.hidden ? '&#9662;' : '&#9652;';
  document.querySelector('table[data-toggle="' + id + '"]').classList.toggle('open', !p.hidden);
}

document.addEventListener('click', function (e) {
  var a = e.target.closest('a');
  if (a) return;
  var t = e.target.closest('table[data-toggle]');
  if (t) { toggle(t.getAttribute('data-toggle')); return; }
  var f = e.target.closest('tr[data-focus]');
  if (f) { document.getElementById('harm').value = f.getAttribute('data-focus'); update(); window.scrollTo(0, 0); }
});

function renderNotes() {
  var li = function (x) { return '<li>' + x + '</li>'; };
  var E = TEXT.equation;
  var causes = WFP.systems.conventional.causes;
  return '<p><b>The harms.</b> ' + fmt(E.notesHarms, { retrieved: WFP.retrieved }) + '</p>' +
    '<ul>' + causes.map(function (c) { return li('<b>' + c.name + '</b>: ' + harmWhat(c) + '.'); }).join('') + '</ul>' +
    '<p>' + E.notesBreeders + '</p>' +
    '<p><b>' + E.notesIntensities + '</b> (<a href="' + SRC.defs + '">project definitions</a>):</p>' +
    '<ul>' + LEVELS.map(function (l) { return li('<b>' + LEVEL_NAMES[l] + '</b>: ' + LEVEL_DEFS[l] + '.'); }).join('') + '</ul>' +
    '<p><b>Uncertainty.</b> ' + E.notesUncertainty + '</p>' +
    '<p><b>' + TEXT.systems.reformed.label + '</b> ' + E.notesReformed + '</p>' +
    '<p><b>Not included:</b> ' + E.notesExcluded + '</p>' +
    '<p><b>Sources</b>, ' + E.notesSources + '</p><ul>' +
    li('<b>NASS</b>: <a href="' + SRC.nass + '">USDA NASS, Poultry Production and Value 2024 Summary</a> (9.33 billion broilers, 61.1 billion lb live weight).') +
    li('<b>ARS</b>: <a href="' + SRC.cooking + '">USDA ARS, Table of Cooking Yields for Meat and Poultry</a> (cooking yield 0.75, so 1.33 g raw per cooked gram).') +
    li('<b>UWisc</b>: <a href="' + SRC.wisc + '">University of Wisconsin Extension, Bird Breakdown</a> (dressing percentage 72–75% for a 6.5 lb commercial broiler; 73.5% used).') +
    li('<b>SR28</b>: <a href="' + SRC.sr28 + '">USDA National Nutrient Database, Standard Reference 28</a>, item 05006 “Chicken, broilers or fryers, meat and skin, raw”: 32% refuse, so 68% edible; item 05011 “meat only, raw”: 52% refuse, so 48% if skin is not counted.') +
    li('<b>UMaine</b>: <a href="' + SRC.umaine + '">University of Maine Extension, Understanding Poultry Yields</a> (definitions of dressing percentage and carcass weight).') +
    li('<b>NCC</b>: <a href="' + SRC.ncc + '">National Chicken Council, U.S. Broiler Performance</a> (47-day lifetime for conventional birds).') +
    li('<b>WFP</b>: Welfare Footprint Institute, <a href="' + SRC.track + '">Pain-Track for broilers</a> (hours by cause and intensity), <a href="' + SRC.tableau + '">Broiler Chickens 2021 workbook</a> (totals with 90% intervals) and <a href="' + SRC.wfp + '">Broilers overview</a> (scenario definitions; \u201conly hours awake are considered\u201d).') +
    '</ul>';
}

function fillStaticText() {
  var E = TEXT.equation;
  document.getElementById('nav-eq').textContent = TEXT.nav.equation;
  document.getElementById('nav-calc').textContent = TEXT.nav.calculator;
  document.getElementById('nav-harms').textContent = TEXT.nav.harms;
  document.getElementById('title').textContent = E.title;
  document.title = E.title;
  document.getElementById('serving-before').textContent = E.servingBefore;
  document.getElementById('serving-after').textContent = E.servingAfter;
  document.getElementById('chicken-label').textContent = E.chickenLabel;
  document.getElementById('harm-label').textContent = E.harmLabel;
  document.getElementById('intro').innerHTML = E.intro;
  document.getElementById('notes-summary').textContent = E.notesSummary;
  var sys = document.getElementById('system');
  Object.keys(SYSTEMS).forEach(function (k) { var o = document.createElement('option'); o.value = k; o.textContent = SYSTEMS[k].label; sys.appendChild(o); });
}

window.addEventListener('DOMContentLoaded', function () {
  fillStaticText();
  fillHarmOptions();
  document.getElementById('harm').value = '0';   // default to the largest single harm, lameness
  document.getElementById('oz').addEventListener('input', update);
  document.getElementById('system').addEventListener('change', function () { fillHarmOptions(); update(); });
  document.getElementById('harm').addEventListener('change', update);
  document.getElementById('notes-body').innerHTML = renderNotes();
  update();
});
</script>

</body>
</html>
